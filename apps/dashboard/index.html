<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>투자자별 매매동향</title>
<style>
  :root {
    --bg:#f2f3f5; --panel:#fff; --line:#d5d8dd; --text:#1c1f24;
    --muted:#6b7280; --head:#eef0f3; --pos:#e5484d; --neg:#2563eb; --sel:#dbeafe;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif; }
  /* 당겨서 새로고침(pull-to-refresh) 표시 */
  #ptr { position:fixed; top:0; left:0; right:0; height:52px; z-index:1000;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:13px; color:var(--muted); background:var(--bg);
    transform:translateY(-56px); will-change:transform; }
  #ptr .ptr-spin { width:16px; height:16px; border-radius:50%;
    border:2px solid #c7ccd2; border-top-color:#6b7280; opacity:0; }
  #ptr.loading .ptr-spin { opacity:1; animation:ptr-rot .7s linear infinite; }
  @keyframes ptr-rot { to { transform:rotate(360deg); } }
  .wrap { display:grid; grid-template-columns:1fr; gap:14px; max-width:1200px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .title { padding:10px 14px; font-size:14px; font-weight:600; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .title small { color:var(--muted); font-weight:400; }
  .toggle-controls { font-size:12px; font-weight:600; color:var(--muted); background:none;
    border:1px solid var(--line); border-radius:12px; padding:3px 10px; cursor:pointer; }
  .controls.collapsed { display:none; }
  table { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  th,td { padding:5px 9px; text-align:right; border-bottom:1px solid #eceef1; }
  th { background:var(--head); color:var(--muted); font-weight:600; position:sticky; top:0; }
  .ntable th:first-child, .ntable td:first-child { text-align:center; color:var(--muted);
    position:sticky; left:0; background:var(--panel); z-index:1; }
  .ntable th:first-child { z-index:2; background:var(--head); }
  .summary td { font-weight:600; }
  .summary td:first-child { background:#f6f7f9; }
  /* 증감 행 강조 배경 */
  .summary.delta td { background:var(--sel); }
  /* 매분 갱신 시 번쩍임 */
  .summary.delta.flash td { animation:deltaFlash 1.8s ease-out; }
  @keyframes deltaFlash {
    0%   { background:#ffd54a; }
    60%  { background:#ffe9a6; }
    100% { background:var(--sel); }
  }
  /* 표를 두 개로 분리: 위(head-table)=헤더+순매수+증감 고정, 아래(body-scroll)=시간 행 스크롤 */
  .head-table { border-bottom:2px solid #9aa0a8; box-shadow:0 3px 4px -2px rgba(0,0,0,.12); }
  /* 시간별 데이터는 6행까지 표시하고, 과거 행은 스크롤로 조회 */
  .body-scroll { max-height:175px; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch; touch-action:pan-y; overscroll-behavior:contain; }
  .head-table, .body-table { table-layout:fixed; }
  .body-table { line-height:18px; }
  tr.moretip td { text-align:center; color:var(--muted); font-size:11px; padding:8px;
    background:#fafbfc; position:static; }
  .pos { color:var(--pos); } .neg { color:var(--neg); }
  .legend { display:flex; gap:16px; padding:8px 14px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
  .legend b { font-weight:600; }
  .legend i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px; }
  svg { display:block; width:100%; height:auto; }
  .empty { padding:40px; text-align:center; color:var(--muted); font-size:13px; }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:6px 4px; padding:10px 12px; }
  .controls .chk { display:inline-flex; align-items:center; gap:5px; font-size:12px; cursor:pointer;
    padding:3px 8px; border:1px solid var(--line); border-radius:14px; user-select:none; background:#fafbfc; }
  .controls .chk input { margin:0; cursor:pointer; }
  .controls .chk .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .controls .chk.off { opacity:.45; }
  .controls .chk.disabled { opacity:.3; cursor:not-allowed; }
  .controls .chk.disabled input { cursor:not-allowed; }
  .controls .selnote { font-size:11px; color:var(--muted); }
  .controls .sep { width:1px; align-self:stretch; background:var(--line); margin:0 4px; }
  .controls .allbtn { font-size:11px; color:var(--muted); background:none; border:1px solid var(--line);
    border-radius:12px; padding:3px 9px; cursor:pointer; }
  .market-sel { display:inline-flex; gap:14px; font-size:14px; font-weight:600; }
  .market-sel label { display:inline-flex; align-items:center; gap:5px; cursor:pointer; color:var(--muted); }
  .market-sel label.on { color:var(--text); }
  .market-sel input { cursor:pointer; }
  .page-title { max-width:1200px; margin:20px auto 6px; font-size:18px; font-weight:700; color:var(--text);
    display:flex; align-items:center; gap:10px; }
  .page-title a { margin-left:auto; font-size:13px; font-weight:400; color:var(--muted);
    text-decoration:none; border:1px solid var(--line); border-radius:14px; padding:4px 12px; }
  .nasfut { max-width:1200px; margin:-2px auto 10px; font-size:12px; font-weight:600; color:var(--muted); }
  .nasfut:empty { display:none; }
  .nasfut .index-name { display:inline-block; width:80px; }
  .nasfut b { font-weight:700; }
  .nasfut .nasdelay { font-size:10px; font-weight:400; color:var(--muted); }
  .view-btn { margin-left:auto; font-size:13px; font-weight:600; color:var(--muted); background:none;
    border:1px solid var(--line); border-radius:14px; padding:4px 12px; cursor:pointer; }
  .view-btn:hover { color:var(--text); }
  /* 세로보기(차트 중심): 카드 1열 세로 배치 + 1분봉 차트를 크게 */
  .mkt-cards.chart-focus { grid-template-columns:1fr; }
  /* 지수값은 왼쪽(기본보기처럼), 차트는 오른쪽에서 넓게 */
  .mkt-cards.chart-focus .mkt-card .top { align-items:center; gap:14px; }
  .mkt-cards.chart-focus .mkt-card .top > div { flex:0 0 auto; }
  .mkt-cards.chart-focus .mkt-card .px { font-size:19px; }
  .mkt-cards.chart-focus .mkt-card .spark { flex:1 1 0; min-width:0; width:auto; height:84px; }
  /* 세로보기에서만 개인/외국인/기관 영역 높이 축소 */
  .mkt-cards.chart-focus .mkt-card { padding-bottom:8px; }
  .mkt-cards.chart-focus .mkt-card .dv { margin:3px 0 2px; }
  .mkt-cards.chart-focus .mkt-card .inv .l { margin-bottom:0; line-height:1.2; }
  .mkt-cards.chart-focus .mkt-card .inv .v { line-height:1.2; }
  /* 종목등락현황 표 (상한/상승/보합/하락/하한) */
  .breadth { max-width:1200px; margin:0 auto 12px; }
  .breadth-tbl { width:100%; border-collapse:collapse; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; overflow:hidden;
    font-size:14px; font-variant-numeric:tabular-nums; }
  .breadth-tbl th, .breadth-tbl td { padding:11px 8px; border-bottom:1px solid #eceef1; text-align:center; }
  .breadth-tbl thead th { background:var(--head); color:var(--text); font-weight:700; }
  .breadth-tbl tbody tr:last-child td { border-bottom:0; }
  .breadth-tbl td.mk { font-weight:700; color:var(--text); }
  .breadth-tbl td.num { font-weight:700; }
  .breadth-tbl .up { color:var(--pos); } .breadth-tbl .dn { color:var(--neg); } .breadth-tbl .flat { color:var(--muted); }
  .breadth-tbl .arw { font-size:11px; margin-left:3px; }
  .breadth-tbl .pct { color:var(--muted); font-weight:400; font-size:11px; }
  .breadth-tbl .pct.low { color:#2563eb; font-weight:700; }   /* 상승비율 35% 미만 경고 */
  /* 프로그램 순매수 상위 종목 */
  .prm-wrap { max-width:1200px; margin:0 auto 24px; }
  .pu-mkt { display:flex; gap:8px; margin-bottom:8px; }
  .page-title .pu-mkt { margin-left:auto; margin-bottom:0; font-weight:400; }   /* 제목 우측에 순매수/순매도 토글 */
  .pu-mkt label { font-size:13px; padding:4px 12px; border:1px solid var(--line); border-radius:14px; cursor:pointer; color:var(--muted); }
  .pu-mkt label.on { background:var(--sel); color:var(--text); border-color:var(--sel); }
  /* 순매수/순매도: 연결형 세그먼트 버튼(시장 토글과 구분, 선택 시 매수=빨강·매도=파랑) */
  #pu-side { gap:0; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  #pu-side label { border:none; border-radius:0; padding:4px 14px; background:var(--panel); color:var(--muted); font-weight:600; }
  #pu-side input { display:none; }   /* 세그먼트 버튼: 라디오 점 숨김 */
  #pu-side label + label { border-left:1px solid var(--line); }
  #pu-side label.on:first-child { background:#fdf1ef; color:var(--pos); }
  #pu-side label.on:last-child  { background:#eef3fd; color:var(--neg); }
  .pu-scroll { max-height:341px; overflow-y:auto; }        /* 접힘: 헤더+약 10행 */
  .pu-scroll.expanded { max-height:1400px; }
  .pu-tbl { width:100%; border-collapse:collapse; }
  .pu-tbl th, .pu-tbl td { padding:7px 10px; font-size:13px; border-bottom:1px solid #eceef1; text-align:right; white-space:nowrap; }
  .pu-tbl thead th { background:var(--head); color:var(--muted); font-weight:600; position:sticky; top:0; z-index:1; }
  .pu-tbl td.rk { text-align:center; color:var(--muted); width:40px; }
  .pu-tbl td.mk, .pu-tbl thead th:first-child { max-width:5.5em; overflow:hidden; text-overflow:ellipsis; }   /* 종목명 폭 축소 */
  .pu-tbl td.mk { text-align:left; font-weight:600; cursor:pointer; }
  .pu-tbl tbody tr:hover { background:var(--head); }
  /* 조회수 상위 종목 */
  .rank-wrap { max-width:1200px; margin:0 auto 14px; }
  /* 종목 캔들 차트 */
  .chart-wrap { max-width:1200px; margin:0 auto 24px; }
  .chart-head { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .chart-name { font-size:13px; font-weight:600; color:var(--text); }
  #stock-chart { padding:8px 10px; }
  .candle-plot { position:relative; }
  .candle-touch-layer { position:absolute; inset:0; touch-action:pan-y; }
  .chart-sel { margin-left:auto; font-size:13px; font-weight:400; padding:4px 26px 4px 12px; cursor:pointer;
    color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:14px; }
  #toggle-chart { margin-left:0; }   /* 봉 주기 select 바로 옆(제목 우측 그룹) */
  /* 접힘: 헤더+약 10행만 보이고 스크롤로 나머지 확인 / 펼침: 20행 모두 */
  .rank-scroll { max-height:310px; overflow-y:auto; }   /* 실제 헤더 + 10행 높이는 렌더링 후 맞춤 */
  .rank-tbl { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  .rank-tbl th, .rank-tbl td { padding:6px 6px; border-bottom:1px solid #eceef1; text-align:right; white-space:nowrap; }
  .rank-tbl thead th { background:var(--head); color:var(--muted); font-weight:600; position:sticky; top:0; z-index:1;
    white-space:normal; line-height:1.25; }
  .rank-tbl td.rk { text-align:center; color:var(--muted); width:24px; padding-left:4px; padding-right:4px; }
  .rank-tbl td.nm { text-align:left; font-weight:600; }
  .amount-rank-title { flex-wrap:wrap; }
  .amount-rank-filter { display:flex; align-items:center; gap:4px; margin-left:auto; font-size:13px; font-weight:400; cursor:pointer; white-space:nowrap; }
  .amount-rank-title .view-btn { margin-left:0; }
  @media (max-width:560px) { .amount-rank-title { font-size:16px; gap:6px; } .amount-rank-filter { font-size:11px; } .amount-rank-title .view-btn { font-size:11px; padding:4px 8px; } }
  #amount-rank-host .rank-tbl { table-layout:fixed; }
  #amount-rank-host td.nm { overflow:hidden; text-overflow:ellipsis; }
  .rank-tbl tbody tr { cursor:pointer; }
  .rank-tbl tbody tr:hover td { background:#f2f6ff; }
  .rank-tbl .pos { color:var(--pos); } .rank-tbl .neg { color:var(--neg); } .rank-tbl .zero { color:var(--muted); }
  .rank-tbl .rup { color:#16a34a; font-size:11px; margin-left:5px; }
  .rank-tbl .rdn { color:#e5484d; font-size:11px; margin-left:5px; }
  .rank-toggle { width:100%; border:0; border-top:1px solid var(--line); background:#fafbfc;
    color:var(--muted); font-size:12px; padding:8px; cursor:pointer; }
  /* 프로그램 순매수금액 */
  .prog-wrap { max-width:1200px; margin:0 auto 16px; }
  .prog-input { width:140px; font-size:13px; padding:4px 8px; border:1px solid var(--line);
    border-radius:8px; font-variant-numeric:tabular-nums; }
  .prog-go { font-size:12px; padding:5px 12px; border:1px solid var(--line); border-radius:12px;
    background:var(--head); cursor:pointer; }
  .prog-go:disabled { opacity:.4; cursor:default; }
  .prog-title { flex-direction:column; align-items:stretch; gap:8px; }
  .prog-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .prog-name { font-size:14px; font-weight:700; color:var(--text); }
  .prog-unit { margin-left:auto; color:var(--muted); font-weight:400; }
  /* 헤더 1행 + 데이터 6행 (행당 29px + 상단 테두리) */
  #prog-table { min-height:212px; display:flow-root; }
  #prog-chart { aspect-ratio:760 / 280; position:relative; }
  #prog-chart > svg { position:absolute; inset:0; }
  #prog-chart > .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:8px; box-sizing:border-box; }
  .prog-tscroll { max-height:204px; overflow:auto; border-top:1px solid var(--line); margin-top:8px; }
  .prog-tbl { width:100%; border-collapse:collapse; font-size:12px; line-height:18px; font-variant-numeric:tabular-nums; }
  .prog-tbl th, .prog-tbl td { padding:5px 10px; border-bottom:1px solid #eceef1; text-align:right; white-space:nowrap; }
  .prog-tbl thead th { background:var(--head); color:var(--muted); font-weight:600; position:sticky; top:0; }
  .prog-tbl td.tm { text-align:center; color:var(--muted); }
  .prog-tbl .pos { color:var(--pos); } .prog-tbl .neg { color:var(--neg); } .prog-tbl .zero { color:var(--muted); }
  @media (max-width:560px){ .breadth-tbl { font-size:12px; } .breadth-tbl th, .breadth-tbl td { padding:9px 4px; } }
  /* 상단 지수 요약 카드 (모바일에서도 좌우 2단 유지) */
  .mkt-cards { max-width:1200px; margin:0 auto 14px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .mkt-card { border-radius:18px; padding:16px 18px; background:#f5f6f8; min-width:0; }
  .mkt-card.up { background:#fdf1ef; } .mkt-card.down { background:#eef3fd; }
  /* 두 시장 비교: 더 강한 상승은 더 빨갛게, 더 약한(더 낮은) 하락은 더 파랗게 */
  .mkt-card.up.strong { background:#fadfd9; } .mkt-card.down.strong { background:#e1e9fb; }
  .mkt-card .top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .mkt-card .nm { font-size:16px; font-weight:700; color:#6b7078; }
  .mkt-card .px { font-size:19px; font-weight:800; line-height:1.1; margin-top:2px; }
  .mkt-card .fl { font-size:12px; font-weight:700; }
  .mkt-card.up .px, .mkt-card.up .fl { color:var(--pos); }
  .mkt-card.down .px, .mkt-card.down .fl { color:var(--neg); }
  .mkt-card.flat .px, .mkt-card.flat .fl { color:var(--muted); }
  .mkt-card .spark { width:150px; height:74px; flex:none; }
  /* 좁은 화면: 2단을 유지하며 카드 내부를 압축 */
  @media (max-width:560px){
    .mkt-cards { gap:8px; }
    .mkt-card { padding:12px 12px; border-radius:14px; }
    .mkt-card .top { gap:8px; }
    .mkt-card .top > div { min-width:0; }
    .mkt-card .nm { font-size:13px; }
    .mkt-card .px { font-size:17px; }
    .mkt-card .fl { font-size:12px; }
    .mkt-card .spark { width:auto; flex:1 1 40px; min-width:40px; height:64px; }  /* 남는 폭에 맞춰 축소 */
    .mkt-card .inv .l { font-size:11px; }
    .mkt-card .inv .v { font-size:12px; }
  }
  @media (max-width:360px){ .mkt-card .spark { height:56px; } }
  .mkt-card .dv { border:0; border-top:1px dashed #d6cfce; margin:12px 0 10px; }
  .mkt-card.down .dv { border-top-color:#cdd6e8; }
  .mkt-card .inv { display:grid; grid-template-columns:1fr 1fr 1fr; text-align:center; gap:6px; }
  .mkt-card .inv .l { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .mkt-card .inv .v { font-size:12px; font-weight:700; }
  .zero { color:var(--muted); }
</style>
</head>
<body>
<div id="ptr"><span class="ptr-spin"></span><span class="ptr-txt">당겨서 새로고침</span></div>
<div class="page-title"><span>지수현황</span>
  <button id="toggle-idxview" class="view-btn" type="button">세로보기</button></div>
<div id="nasdaq-fut" class="nasfut"></div>
<div id="nikkei-index" class="nasfut"></div>
<div id="taiwan-index" class="nasfut"></div>
<div class="mkt-cards" id="mkt-cards"></div>
<div class="page-title"><span>종목등락현황</span>
  <button id="toggle-breadth" class="view-btn" type="button">접기 ▾</button></div>
<div class="breadth" id="breadth"></div>
<div class="page-title"><span>투자자별 매매동향</span></div>
<div class="wrap">
  <div class="panel">
    <div class="title">
      <span class="market-sel" id="market-sel"></span>
      <button class="toggle-controls" id="toggle-controls" type="button">투자자 선택 ▾</button>
    </div>
    <div class="controls" id="controls"></div>
  </div>
  <div class="panel">
    <div class="title">누적 순매수 추이</div>
    <div class="legend" id="chart-legend"></div>
    <div id="chart-host"></div>
  </div>
  <div class="panel">
    <div class="title"><span id="label-lbl"></span> 순매수 <small id="date-lbl"></small></div>
    <div id="table-host"></div>
  </div>
</div>
<div class="page-title"><span>조회수 상위 종목</span></div>
<div class="rank-wrap">
  <div class="panel">
    <div id="rank-host"></div>
  </div>
</div>
<div class="page-title amount-rank-title"><span>거래대금 상위 종목</span><label class="amount-rank-filter"><input id="exclude-etf-etn" type="checkbox" role="switch" checked>ETF/ETN 제외</label><button id="toggle-amount-rank" class="view-btn" type="button" aria-controls="amount-rank-content" aria-expanded="true">접기 ▾</button></div>
<div class="rank-wrap" id="amount-rank-content">
  <div class="panel">
    <div id="amount-rank-host"></div>
    <div id="amount-rank-status" role="status" style="padding:8px 12px;font-size:12px;color:var(--muted)" hidden></div>
  </div>
</div>
<div class="page-title"><span>프로그램 상위 종목</span><div class="pu-mkt" id="pu-side"></div></div>
<div class="prm-wrap">
  <div class="pu-mkt" id="pu-mkt"></div>
  <div class="panel">
    <div id="prm-upper"></div>
  </div>
</div>
<div class="page-title"><span>종목별 프로그램 순매수</span><button id="toggle-program" class="view-btn" type="button" aria-controls="program-content" aria-expanded="true">접기 ▾</button></div>
<div class="prog-wrap" id="program-content">
  <div class="panel">
    <div class="title prog-title">
      <div class="prog-row">
        <input id="prog-stk" class="prog-input" value="005930" placeholder="종목코드/종목명">
        <button id="prog-go" class="prog-go" type="button">조회</button>
        <button id="prog-more" class="prog-go" type="button" style="margin-left:auto" disabled>연속조회</button>
      </div>
      <div class="prog-row">
        <span class="market-sel" id="prog-amt">
          <label class="on"><input type="radio" name="progamt" value="1" checked>금액</label>
          <label><input type="radio" name="progamt" value="2">수량</label>
        </span>
        <span id="prog-name" class="prog-name"></span>
        <small class="prog-unit" id="prog-count"></small>
      </div>

<div class="page-title" id="stock-chart-title"><span>종목 차트</span><select id="chart-tf" class="chart-sel"></select><button id="toggle-chart" class="view-btn" type="button">접기 ▾</button></div>
<div class="chart-wrap">
  <div class="chart-head">
    <input id="chart-code" class="prog-input" value="" placeholder="종목코드/종목명">
    <button id="chart-go" class="prog-go" type="button">조회</button>
    <button id="chart-more" class="prog-go" type="button" style="margin-left:auto" disabled>추가조회</button>
    <span id="chart-name" class="chart-name"></span>
  </div>
  <div class="panel">
    <div id="stock-chart"></div>
  </div>
</div>
<script>
let DATA = { date:null, label:'', columns:[], points:[], default_selected:[], markets:[] };
let selected = null;           // Set<key> — 표시할 투자자

// 지수현황 보기 모드: false=기본(좌우 카드), true=세로보기(1분봉 차트 중심)
let chartFocus = false;
try { chartFocus = localStorage.getItem('idx_chart_focus') === '1'; } catch (e) {}

const fmtSigned = v => (v > 0 ? '+' : '') + v.toLocaleString();
const cls = v => v > 0 ? 'pos' : (v < 0 ? 'neg' : '');
const LS_KEY = 'netprps_selected';
const LS_MARKET = 'netprps_market';

// 현재 선택 시장 (기본 kospi) — 최초 fetch 전에도 사용
let curMarket = (function () {
  try { return localStorage.getItem(LS_MARKET) || 'kospi'; } catch (e) { return 'kospi'; }
})();

function renderMarkets() {
  const host = document.getElementById('market-sel');
  host.innerHTML = (DATA.markets || []).map(m =>
    `<label class="${m.key === curMarket ? 'on' : ''}">`
    + `<input type="radio" name="mkt" value="${m.key}" ${m.key === curMarket ? 'checked' : ''}>${m.name}</label>`
  ).join('');
  host.querySelectorAll('input[name="mkt"]').forEach(r => {
    r.addEventListener('change', () => {
      curMarket = r.value;
      try { localStorage.setItem(LS_MARKET, curMarket); } catch (e) {}
      visibleCount = PAGE;                                   // 새 시장은 최신부터
      document.getElementById('table-host').innerHTML = '';  // 표 초기화
      refresh();
    });
  });
}

function loadSelected() {
  let set;
  try {
    const raw = localStorage.getItem(LS_KEY);
    set = raw ? new Set(JSON.parse(raw)) : new Set(DATA.default_selected || []);
  } catch (e) { set = new Set(DATA.default_selected || []); }
  // 최대 개수 초과 저장분은 앞에서부터 잘라냄
  if (set.size > MAX_SELECT) set = new Set([...set].slice(0, MAX_SELECT));
  return set;
}
function saveSelected() {
  try { localStorage.setItem(LS_KEY, JSON.stringify([...selected])); } catch (e) {}
}
// 선택된 컬럼(원래 순서 유지)
function activeCols() { return DATA.columns.filter(c => selected.has(c.key)); }

function renderControls() {
  const host = document.getElementById('controls');
  const full = selected.size >= MAX_SELECT;   // 최대 도달 시 미선택 항목 비활성화
  let html = '';
  DATA.columns.forEach(c => {
    const on = selected.has(c.key);
    const disabled = !on && full;
    html += `<label class="chk ${on ? '' : 'off'}${disabled ? ' disabled' : ''}" data-key="${c.key}">`
      + `<input type="checkbox" ${on ? 'checked' : ''} ${disabled ? 'disabled' : ''}>`
      + `<span class="dot" style="background:${c.color}"></span>${c.name}</label>`;
  });
  html += '<span class="sep"></span>'
    + `<span class="selnote">${selected.size}/${MAX_SELECT}</span>`
    + '<button class="allbtn" data-act="none">해제</button>';
  host.innerHTML = html;

  host.querySelectorAll('.chk').forEach(el => {
    el.addEventListener('change', () => {
      const key = el.dataset.key;
      const checked = el.querySelector('input').checked;
      if (checked) {
        if (selected.size >= MAX_SELECT) { renderControls(); return; }  // 초과 방지
        selected.add(key);
      } else {
        selected.delete(key);
      }
      saveSelected(); renderControls(); renderTable(); renderChart();
    });
  });
  host.querySelector('.allbtn[data-act="none"]').addEventListener('click', () => {
    selected.clear();
    saveSelected(); renderControls(); renderTable(); renderChart();
  });
}

const PAGE = 10;        // 처음/추가로 불러오는 시간별 행 수
let visibleCount = PAGE;// 현재 표시 중인 시간별 행 수(최신부터, 스크롤로 증가)
const MAX_SELECT = 5;   // 투자자 최대 선택 수
let lastLatestT;        // 직전에 본 최신 시각(새 분 감지용)

function flashDelta() {
  const el = document.getElementById('delta-row');
  if (!el) return;
  el.classList.remove('flash');
  void el.offsetWidth;          // reflow 강제 → 애니메이션 재시작
  el.classList.add('flash');
}

function renderTable() {
  const host = document.getElementById('table-host');
  document.getElementById('label-lbl').textContent = DATA.label || '';
  document.getElementById('date-lbl').textContent = DATA.date ? `기준일 ${DATA.date}` : '';
  const pts = DATA.points, cols = activeCols();
  if (DATA.preopen) { host.innerHTML = '<div class="empty">장 시작 대기 중…</div>'; return; }
  if (!pts.length) { host.innerHTML = '<div class="empty">아직 기록된 데이터가 없습니다.</div>'; return; }
  if (!cols.length) { host.innerHTML = '<div class="empty">위에서 투자자를 선택하세요.</div>'; return; }

  const last = pts[pts.length - 1];
  const prev = pts.length > 1 ? pts[pts.length - 2] : null;

  // 위쪽 고정 테이블 행들(헤더/순매수/증감)
  let headRows = '<tr class="hrow"><th>시간</th>';
  cols.forEach(c => headRows += `<th>${c.name}</th>`);
  headRows += '</tr><tr class="summary sum1"><td>순매수</td>';
  cols.forEach(c => headRows += `<td class="${cls(last[c.key])}">${fmtSigned(last[c.key])}</td>`);
  headRows += `</tr><tr class="summary delta sum2" id="delta-row"><td>증감</td>`;
  cols.forEach(c => {
    const d = prev ? last[c.key] - prev[c.key] : 0;
    headRows += `<td class="${cls(d)}">${fmtSigned(d)}</td>`;
  });
  headRows += '</tr>';

  // 아래쪽 시간 행들(최신 visibleCount개)
  const shown = Math.min(visibleCount, pts.length);
  const startIdx = pts.length - shown;
  let bodyRows = '';
  for (let i = pts.length - 1; i >= startIdx; i--) bodyRows += timeRowHtml(pts[i], cols);
  if (shown < pts.length) bodyRows += moretipHtml(pts.length - shown, cols.length);

  // 구조는 한 번만 생성하고, 이후에는 tbody 내용만 교체(스크롤 컨테이너 유지 → 관성 보존)
  let bscroll = host.querySelector('.body-scroll');
  const prevTop = bscroll ? bscroll.scrollTop : 0;
  if (!bscroll) {
    host.innerHTML =
      '<table class="ntable head-table"><colgroup></colgroup><tbody class="hbody"></tbody></table>'
      + '<div class="body-scroll"><table class="ntable body-table"><colgroup></colgroup><tbody class="bbody"></tbody></table></div>';
    bscroll = host.querySelector('.body-scroll');
    bscroll.addEventListener('scroll', onTableScroll);
  }
  host.querySelector('.hbody').innerHTML = headRows;
  host.querySelector('.bbody').innerHTML = bodyRows;
  syncColumnWidths(host, cols.length);
  bscroll.scrollTop = prevTop;
}

function timeRowHtml(p, cols) {
  return `<tr class="trow"><td>${p.t.slice(0,5)}</td>`
    + cols.map(c => `<td class="${cls(p[c.key])}">${fmtSigned(p[c.key])}</td>`).join('') + '</tr>';
}
function moretipHtml(remain, nCols) {
  return `<tr class="moretip"><td colspan="${nCols + 1}">아래로 스크롤하면 ${Math.min(PAGE, remain)}개 더 불러옵니다 (남은 ${remain}개)</td></tr>`;
}

// 스크롤로 더 볼 때는 전체 재렌더 없이 '새로 보이는 과거 행'만 아래에 append (버벅임 방지)
function appendOlderRows() {
  const host = document.getElementById('table-host');
  const bbody = host.querySelector('.bbody');
  if (!bbody) { renderTable(); return; }
  const pts = DATA.points, cols = activeCols();
  const rendered = bbody.querySelectorAll('tr.trow').length;
  const curStart = pts.length - rendered;                 // 현재 표시된 가장 오래된 인덱스
  const newStart = Math.max(0, pts.length - Math.min(visibleCount, pts.length));
  if (newStart >= curStart) return;                       // 추가할 것 없음
  let html = '';
  for (let i = curStart - 1; i >= newStart; i--) html += timeRowHtml(pts[i], cols);
  const mt = bbody.querySelector('.moretip');
  if (mt) mt.remove();
  bbody.insertAdjacentHTML('beforeend', html);
  if (newStart > 0) bbody.insertAdjacentHTML('beforeend', moretipHtml(newStart, cols.length));
}

// 두 테이블의 컬럼 너비를 맞춘다(스크롤바 폭까지 반영해 정렬).
function syncColumnWidths(host, nCols) {
  const bscroll = host.querySelector('.body-scroll');
  const W = bscroll.clientWidth;               // 세로 스크롤바 제외한 실제 폭
  const FIRST_W = 56;                          // '시간' 열 고정 폭
  const rest = Math.max(0, W - FIRST_W);
  const each = Math.floor(rest / nCols);
  const widths = [FIRST_W];
  for (let i = 0; i < nCols; i++) widths.push(i === nCols - 1 ? rest - each * (nCols - 1) : each);
  const cg = widths.map(w => `<col style="width:${w}px">`).join('');
  host.querySelectorAll('colgroup').forEach(el => el.innerHTML = cg);
  host.querySelectorAll('.ntable').forEach(t => t.style.width = W + 'px');
}

function onTableScroll(e) {
  const el = e.currentTarget;
  // 바닥 근처(120px)에 도달하면 과거 데이터 PAGE개 더 append (전체 재렌더 없이)
  if (el.scrollTop + el.clientHeight >= el.scrollHeight - 120) {
    if (visibleCount < DATA.points.length) {
      visibleCount += PAGE;
      appendOlderRows();
    }
  }
}

function renderChartLegend(cols) {
  const lg = document.getElementById('chart-legend');
  lg.innerHTML = cols.map(c =>
    `<span><i style="background:${c.color}"></i><b>${c.name}</b></span>`).join('');
}

function renderChart() {
  const host = document.getElementById('chart-host');
  const pts = DATA.points, cols = activeCols();
  renderChartLegend(cols);
  if (DATA.preopen) { host.innerHTML = '<div class="empty">장 시작 대기 중…</div>'; return; }
  if (!cols.length) { host.innerHTML = '<div class="empty">위에서 투자자를 선택하세요.</div>'; return; }
  if (pts.length < 2) { host.innerHTML = '<div class="empty">차트를 그리려면 2개 이상의 스냅샷이 필요합니다.</div>'; return; }

  const W = 760, H = 420, mL = 8, mR = 56, mT = 16, mB = 28;
  const iw = W - mL - mR, ih = H - mT - mB;

  let vmin = 0, vmax = 0;
  pts.forEach(p => cols.forEach(c => { vmin = Math.min(vmin, p[c.key]); vmax = Math.max(vmax, p[c.key]); }));
  if (vmin === vmax) vmax = vmin + 1;
  const pad = (vmax - vmin) * 0.08; vmin -= pad; vmax += pad;

  const n = pts.length;
  // x축은 실제 시간 기준(첫~마지막 기록 시각). 중간에 비면 그만큼 벌어지고 계단식으로 이음.
  const tmin = p => { const q = (p.t || '').split(':'); return (+q[0]) * 60 + (+q[1]); };
  const mins = pts.map(tmin);
  const t0 = mins[0], tspan = Math.max(1, mins[n-1] - t0);
  const x = i => mL + (n === 1 ? iw/2 : (mins[i] - t0) / tspan * iw);
  const y = v => mT + ih * (1 - (v - vmin) / (vmax - vmin));
  const GAP = 2;   // 분 초과 공백은 계단식(수평→수직)

  const ticks = 6; let grid = '';
  for (let k = 0; k <= ticks; k++) {
    const v = vmin + (vmax - vmin) * k / ticks, yy = y(v);
    grid += `<line x1="${mL}" y1="${yy}" x2="${mL+iw}" y2="${yy}" stroke="#eceef1"/>`;
    grid += `<text x="${mL+iw+6}" y="${yy+4}" font-size="11" fill="#9aa0a8">${Math.round(v).toLocaleString()}</text>`;
  }
  if (vmin < 0 && vmax > 0) {
    const y0 = y(0);
    grid += `<line x1="${mL}" y1="${y0}" x2="${mL+iw}" y2="${y0}" stroke="#c7ccd2"/>`;
  }

  let xlab = ''; const step = Math.max(1, Math.floor(n / 6));
  for (let i = 0; i < n; i += step)
    xlab += `<text x="${x(i)}" y="${H-8}" font-size="10" fill="#9aa0a8" text-anchor="middle">${pts[i].t.slice(0,5)}</text>`;

  let lines = '';
  cols.forEach(c => {
    let d = '';
    pts.forEach((p, i) => {
      const xi = x(i).toFixed(1), yi = y(p[c.key]).toFixed(1);
      if (i === 0) { d += `M${xi},${yi}`; return; }
      // 공백이면 이전 값으로 수평 이동 → 끝점 x에서 위/아래로 수직 이동
      if (mins[i] - mins[i-1] > GAP) d += ` L${xi},${y(pts[i-1][c.key]).toFixed(1)} L${xi},${yi}`;
      else d += ` L${xi},${yi}`;
    });
    lines += `<path d="${d}" fill="none" stroke="${c.color}" stroke-width="3.6"/>`;
    lines += `<circle cx="${x(n-1)}" cy="${y(pts[n-1][c.key])}" r="2.6" fill="${c.color}"/>`;
  });

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">` + grid + lines + xlab + '</svg>';
}

// ── 상단 지수 요약 카드 ──
const fmtIdx = v => (v == null) ? '-' : v.toLocaleString('ko-KR', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtFlu = v => (v == null) ? '' : (v > 0 ? '+' : '') + v.toFixed(2) + '%';
const fmtNet = v => (v == null) ? '-' : (v > 0 ? '+' : '') + v.toLocaleString('ko-KR');

// 어제(회색) + 오늘(방향색) 지수 1분봉 종가 라인. 경계에 세로선, 전일종가에 점선.
// x축은 '점 순서'가 아니라 '실제 시간(정규장 09:00~15:30)' 기준 → 중간에 데이터가
// 비면(수집 중단 등) 그 시간만큼 벌어지고 양 끝점이 직선으로 이어진다.
function mktSpark(prevSeries, todaySeries, base, flu, W = 150, H = 56, openPx = null) {
  const pad = 5;                       // x축 좌우 여백
  const padY = 0;                      // y축 상하 여백 없음(기본/세로보기 모두)
  const prev = prevSeries || [];
  let today = (todaySeries || []).filter(s => (s.t || '').slice(0, 5) >= '09:01');   // 오늘은 09:01부터
  // 동시호가로 확정된 실제 시가(open_pric)를 09:00 시작점으로 앵커링 → 라인이 시가선에서 출발
  if (openPx != null && today.length) today = [{ t: '09:00:00', idx: openPx }, ...today];
  const all = prev.concat(today);
  if (all.length < 2) return `<svg class="spark" viewBox="0 0 ${W} ${H}"></svg>`;
  // 오늘 실제 시가(우선), 없으면 오늘 첫 점 — 시가선/색 기준. 스케일에도 포함해 항상 보이게.
  const tOpen = (openPx != null ? openPx : (today.length ? today[0].idx : null));
  const vals = all.map(s => s.idx);
  if (tOpen != null) vals.push(tOpen);
  let lo = Math.min(...vals), hi = Math.max(...vals);   // 실제 지수 변동 범위로 스케일(전일종가에 눌리지 않도록)
  if (lo === hi) hi = lo + 1;
  const yp = (hi - lo) * (chartFocus ? 0 : 0.06); lo -= yp; hi += yp;   // 스케일 여백(세로보기는 진폭 최대)

  // 정규장 시간축: 09:00(540분)~15:30(930분). 어제/오늘 데이터가 모두 있으면
  // 왼쪽 절반=어제, 오른쪽 절반=오늘로 나눠 각 구간을 시간비율로 배치.
  const OPEN = 540, SPAN = 390;          // 정규장 09:00(540)~15:30(930), 390분
  const PREV_W = 0.25;                    // 어제(회색)가 차지하는 가로 비율(오늘을 넓게)
  const inner = W - pad * 2;
  const hasPrev = prev.length > 0, hasToday = today.length > 0;
  const tmin = s => { const p = (s.t || '').split(':'); return (+p[0]) * 60 + (+p[1]); };
  const clamp = v => Math.max(0, Math.min(1, v));
  const mid = (hasPrev && hasToday) ? pad + inner * PREV_W : null;
  const pL = pad, pR = (mid == null) ? W - pad : mid;   // 어제 구간 x범위
  const tL = (mid == null) ? pad : mid, tR = W - pad;   // 오늘 구간 x범위
  // 어제: 09:00~15:30 전체를 좁은 구간에 배치. 오늘: 09:00~'현재(마지막 데이터)'까지로
  // 배치해 오른쪽 미래 여백을 없앰(최신값이 항상 오른쪽 끝).
  const nowMin = hasToday ? tmin(today[today.length - 1]) : OPEN;
  const todaySpan = Math.max(1, nowMin - OPEN);
  const xPrev = s => pL + clamp((tmin(s) - OPEN) / SPAN) * (pR - pL);
  const xToday = s => tL + clamp((tmin(s) - OPEN) / todaySpan) * (tR - tL);
  const y = v => padY + (H - padY*2) * (1 - (v - lo) / (hi - lo));
  // 오늘 라인/영역 색: '오늘 시가' 대비 현재가 위면 빨강, 아래면 파랑(배경색과 무관)
  const tCur = today.length ? today[today.length - 1].idx : null;
  const color = (tOpen == null || tCur === tOpen) ? 'var(--muted)'
              : (tCur > tOpen ? 'var(--pos)' : 'var(--neg)');

  // 공백(2분 초과)이면 계단식: 이전 y로 수평 이동 → 끝점 x에서 위/아래로 수직 이동
  const GAP = 2;
  const seg = (a, b) => (b.min - a.min > GAP)
    ? `L${b.x.toFixed(1)},${a.y.toFixed(1)} L${b.x.toFixed(1)},${b.y.toFixed(1)} `
    : `L${b.x.toFixed(1)},${b.y.toFixed(1)} `;
  const gpts = prev.map(s => ({ x: xPrev(s), y: y(s.idx), min: tmin(s) }));
  const tpts = today.map(s => ({ x: xToday(s), y: y(s.idx), min: tmin(s) }));

  let gray = '';
  gpts.forEach((p, i) => { gray += i === 0 ? `M${p.x.toFixed(1)},${p.y.toFixed(1)} ` : seg(gpts[i-1], p); });

  // 오늘 라인: 어제와 잇지 않고 오늘 첫 점부터 새로 시작(어제 종가↔오늘 시가 연결선 생략)
  let colr = '';
  tpts.forEach((p, i) => {
    if (i === 0) colr += `M${p.x.toFixed(1)},${p.y.toFixed(1)} `;
    else colr += seg(tpts[i-1], p);
  });

  // 오늘 구간 아래 영역 채움(라인과 동일한 계단식 경로)
  let area = '';
  if (hasToday) {
    let a = `M${tpts[0].x.toFixed(1)},${(H-padY).toFixed(1)} L${tpts[0].x.toFixed(1)},${tpts[0].y.toFixed(1)} `;
    for (let i = 1; i < tpts.length; i++) a += seg(tpts[i-1], tpts[i]);
    a += `L${tpts[tpts.length-1].x.toFixed(1)},${(H-padY).toFixed(1)} Z`;
    area = `<path d="${a}" fill="${color}" opacity="0.10"/>`;
  }
  let baseLine = '';
  if (base != null) {
    const yb = Math.max(padY, Math.min(H - padY, y(base)));   // 범위 밖이면 가장자리에 고정
    baseLine = `<line x1="${pad}" y1="${yb.toFixed(1)}" x2="${W-pad}" y2="${yb.toFixed(1)}" stroke="#c7ccd2" stroke-width="1" stroke-dasharray="3 3"/>`;
  }
  const divider = (mid != null)
    ? `<line x1="${mid.toFixed(1)}" y1="${padY}" x2="${mid.toFixed(1)}" y2="${H-padY}" stroke="#b8bec7" stroke-width="1"/>` : '';

  // 오늘 시가(09:01 첫 지수)에 얇은 검정 가로선 — 오늘 구간에만
  let openLine = '';
  if (hasToday && tOpen != null) {
    const yo = Math.max(padY, Math.min(H - padY, y(tOpen)));
    openLine = `<line x1="${tL.toFixed(1)}" y1="${yo.toFixed(1)}" x2="${(W-pad).toFixed(1)}" y2="${yo.toFixed(1)}" stroke="#111" stroke-width="0.6"/>`;
  }

  const swMain = H > 100 ? 1.3 : 1, swGray = H > 100 ? 1 : 0.8;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`
    + area + baseLine + divider + openLine
    + (gray ? `<path d="${gray}" fill="none" stroke="#b6bac1" stroke-width="${swGray}" stroke-linejoin="round"/>` : '')
    + `<path d="${colr}" fill="none" stroke="${color}" stroke-width="${swMain}" stroke-linejoin="round"/></svg>`;
}

function mktCard(m, strong) {
  const SW = chartFocus ? 900 : 150, SH = chartFocus ? 84 : 56;   // 세로보기(차트 중심)면 크게
  if (m.preopen) {
    // 장 시작 전 대기: 전일 종가 + (+0.00%) + 회색 배경. 순매수는 오늘 값으로 갱신.
    const inv = [['개인', m.ind], ['외국인', m.frgnr], ['기관', m.orgn]]
      .map(([l, v]) => `<div><div class="l">${l}</div><div class="v ${cls(v)}">${fmtNet(v)}</div></div>`).join('');
    const prevClose = (m.series_prev && m.series_prev.length) ? m.series_prev[m.series_prev.length - 1].idx : m.idx;
    return `<div class="mkt-card flat"><div class="top"><div>`
      + `<div class="nm">${m.name}</div>`
      + (m.idx != null
          ? `<div class="px">${fmtIdx(m.idx)}</div><div class="fl">(+0.00%)</div>`
          : `<div class="empty">장 시작 대기 중…</div>`)
      + `</div>${mktSpark(m.series_prev, [], prevClose, 0, SW, SH)}</div>`
      + `<hr class="dv"><div class="inv">${inv}</div></div>`;
  }
  const dc = m.flu > 0 ? 'up' : (m.flu < 0 ? 'down' : 'flat');
  const sc = strong ? ' strong' : '';
  const inv = [['개인', m.ind], ['외국인', m.frgnr], ['기관', m.orgn]]
    .map(([l, v]) => `<div><div class="l">${l}</div><div class="v ${cls(v)}">${fmtNet(v)}</div></div>`).join('');
  const has = m.idx != null;
  // 전일종가: 어제 시계열의 마지막 값(없으면 오늘 지수-전일대비)
  const prevClose = (m.series_prev && m.series_prev.length) ? m.series_prev[m.series_prev.length - 1].idx
                   : (m.idx != null && m.pred != null ? m.idx - m.pred : null);
  return `<div class="mkt-card ${dc}${sc}"><div class="top"><div>`
    + `<div class="nm">${m.name}</div>`
    + (has ? `<div class="px">${fmtIdx(m.idx)}</div><div class="fl">(${fmtFlu(m.flu)})</div>`
           : `<div class="empty">데이터 수집 대기 중…</div>`)
    + `</div>${mktSpark(m.series_prev, m.series, prevClose, m.flu, SW, SH, m.open)}</div>`
    + `<hr class="dv"><div class="inv">${inv}</div></div>`;
}

function breadthTable(markets) {
  const num = v => (v == null) ? '-' : v.toLocaleString('ko-KR');
  const risePct = m => {
    const total = (m.upl||0) + (m.rising||0) + (m.flat||0) + (m.fall||0) + (m.lst||0);
    return (total > 0 && m.rising != null) ? Math.round(m.rising / total * 100) : null;
  };
  const head = `<tr><th>구분</th>`
    + `<th>상한<span class="arw up">▲</span></th>`
    + `<th>상승<span class="arw up">▲</span></th>`
    + `<th>보합<span class="arw flat">–</span></th>`
    + `<th>하락<span class="arw dn">▼</span></th>`
    + `<th>하한<span class="arw dn">▼</span></th></tr>`;
  const rows = markets.map(m => {
    const pct = risePct(m);
    const pctHtml = pct == null ? '' : ` <span class="pct${pct < 35 ? ' low' : ''}">(${pct}%)</span>`;
    return `<tr><td class="mk">${m.name}</td>`
      + `<td class="num up">${num(m.upl)}</td>`
      + `<td class="num up">${num(m.rising)}${pctHtml}</td>`
      + `<td class="num flat">${num(m.flat)}</td>`
      + `<td class="num dn">${num(m.fall)}</td>`
      + `<td class="num dn">${num(m.lst)}</td></tr>`;
  }).join('');
  return `<table class="breadth-tbl"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

let amountRankGeneration = 0;

async function loadAmountRank(more = false) {
  if (amountRankLoading || (more && !(amountRankCont === 'Y' && amountRankNext))) return;
  const scroll = document.querySelector('#amount-rank-host .rank-scroll');
  // 추가 순위를 보는 동안 자동 갱신으로 첫 페이지에 돌아가지 않는다.
  if (!more && amountRankItems.length && (scroll?.scrollTop > 0 || document.getElementById('amount-rank-content').hidden)) return;
  amountRankLoading = true;
  const generation = amountRankGeneration;
  const exclude = document.getElementById('exclude-etf-etn').checked;
  const status = document.getElementById('amount-rank-status');
  status.hidden = false; status.textContent = '불러오는 중…';
  const cursor = more ? amountRankNext : '';
  try {
    const url = '/api/amount_rank?exclude_etf_etn=' + (exclude ? '1' : '0')
      + (more ? '&cont=Y&next=' + encodeURIComponent(cursor) : '');
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    if (generation !== amountRankGeneration) return;
    if (data.error) throw new Error(data.error);
    const merged = new Map((more ? amountRankItems : []).map(item => [item.code, item]));
    (data.items || []).forEach(item => merged.set(item.code, item));
    amountRankItems = [...merged.values()].sort((a, b) => a.rank - b.rank);
    amountRankNext = data.next || '';
    amountRankCont = more && amountRankNext === cursor ? 'N' : data.cont || 'N';
    renderAmountRankTable();
    status.textContent = amountRankCont === 'Y' && amountRankNext ? '' : '마지막 순위까지 표시했습니다.';
    status.hidden = !status.textContent || !amountRankItems.length;
  } catch (error) {
    if (generation !== amountRankGeneration) return;
    status.textContent = '조회 실패: ' + error.message + ' · ' + (more ? '조금 위로 스크롤한 뒤 다시 내려 재시도하세요.' : '다음 갱신 때 재시도합니다.');
    status.hidden = false;
  } finally {
    if (generation === amountRankGeneration) {
      amountRankLoading = false;
      if (exclude && amountRankItems.length < 10 && amountRankCont === 'Y' && amountRankNext && status.textContent === '') loadAmountRank(true);
    }
  }
}
document.getElementById('exclude-etf-etn').addEventListener('change', () => {
  amountRankGeneration++;
  amountRankLoading = false;
  amountRankItems = []; amountRankCont = 'N'; amountRankNext = '';
  document.getElementById('amount-rank-host').innerHTML = '';
  loadAmountRank();
});

let listedStockSelection = 0;
// 선택 즉시 하단으로 이동하고, 조회 후 화면 높이가 바뀌면 위치를 보정한다.
async function selectListedStock(code, name) {
  const selection = ++listedStockSelection;
  const requests = [setChartStock(code, name), loadProgStock(code, name)];
  const initialHeight = document.documentElement.scrollHeight;
  scrollToPageBottom();
  await Promise.allSettled(requests);
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  if (selection !== listedStockSelection) return;
  if (document.documentElement.scrollHeight !== initialHeight) scrollToPageBottom();
}

// 차트 접힘 상태는 유지한다.
function scrollToPageBottom() {
  window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
}

// 코드와 이름을 함께 보존한다. 기존 코드-only 저장값은 이름 조회로 보완한다.
async function restoreStockInput(code, name, storageKey, inputId) {
  const input = document.getElementById(inputId);
  if (!input) return;
  if (!name) {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey + '_display') || 'null');
      if (saved && saved.code === code) name = saved.name || '';
    } catch (e) {}
  }
  input.value = name || code;
  if (!code) return;
  const initial = input.value;
  if (!name) {
    try {
      const response = await fetch('/api/stock?q=' + encodeURIComponent(code), { cache: 'no-store' });
      if (!response.ok) return;
      const stock = await response.json();
      if (stock.code !== code || !stock.name) return;
      name = stock.name;
    } catch (e) { return; }
  }
  // 늦은 응답으로 새 종목 선택이나 입력을 덮어쓰지 않는다.
  if (input.value !== initial) return;
  try {
    if (localStorage.getItem(storageKey) !== code) return;
    localStorage.setItem(storageKey + '_display', JSON.stringify({ code, name }));
  } catch (e) {}
  input.value = name;
}

// 종가 기준 단순이동평균: 필요한 봉 수가 쌓인 지점부터 표시한다.
function movingAverage(items, period) {
  let sum = 0;
  return items.map((item, i) => {
    sum += item.c;
    if (i >= period) sum -= items[i - period].c;
    return i >= period - 1 ? sum / period : null;
  });
}

  const end = Math.max(2, items.length - candleViewOffset);
  const start = Math.max(0, end - (candleViewCount || items.length));
  const fullAverages = CHART_MAS.map(([period]) => movingAverage(fullItems, period));
  items = fullItems.slice(start, end);
  const W = 760, H = 430, priceH = 300, mL = 8, mR = 64, mT = 10, mB = 22;
  const iw = W - mL - mR, ih = priceH - mT - mB, n = items.length;
  let lo = Math.min(...items.map(d => d.l)), hi = Math.max(...items.map(d => d.h));
  fullAverages.forEach(values => values.slice(start, end).forEach(value => {
    if (value !== null) { lo = Math.min(lo, value); hi = Math.max(hi, value); }
  }));
  if (lo === hi) hi = lo + 1;
  const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  const cw = iw / n, bw = Math.max(1, Math.min(cw * 0.7, 9));
  const xc = i => mL + cw * (i + 0.5);
  const y = v => mT + ih * (1 - (v - lo) / (hi - lo));

  // 가격 범위에 맞는 1·2·5 계열의 원 단위 간격으로 눈금을 정렬한다.
  const rawPriceStep = Math.max(1, (hi - lo) / 5);
  const priceMagnitude = 10 ** Math.floor(Math.log10(rawPriceStep));
  const priceStep = [1, 2, 5, 10].find(mult => mult * priceMagnitude >= rawPriceStep) * priceMagnitude;
  let grid = '';
  const firstPriceTick = Math.ceil(lo / priceStep) * priceStep;
  for (let v = firstPriceTick; v <= hi; v += priceStep) {
    const yy = y(v);
    grid += `<line x1="${mL}" y1="${yy.toFixed(1)}" x2="${mL+iw}" y2="${yy.toFixed(1)}" stroke="#eceef1"/>`;
    grid += `<text x="${mL+iw+6}" y="${(yy+4).toFixed(1)}" font-size="11" fill="#000000">${Math.round(v).toLocaleString()}</text>`;
  }

  const isMin = tf.endsWith('m');
  const fmt = t => isMin
    ? (t.length >= 12 ? t.slice(8,10)+':'+t.slice(10,12) : t)
    : (t.length >= 8 ? t.slice(4,6)+'/'+t.slice(6,8) : t);
  let xlab = ''; const step = Math.max(1, Math.ceil(n / 6));
  for (let i = 0; i < n; i += step) {
    const xx = xc(i);
    xlab += `<text x="${xx.toFixed(1)}" y="${priceH-6}" font-size="10" fill="#000000" text-anchor="middle">${fmt(items[i].t)}</text>`;
  }

  // 분봉은 거래일, 일봉은 표시 봉 수에 따라 월/연 경계를 표시한다.
  let daySeparators = '';
  const yearlyBoundaries = tf === 'D' && n > 250;
  if (isMin || tf === 'D') {
    for (let i = 1; i < n; i++) {
      const previousDate = items[i - 1].t.slice(0, 8);
      const date = items[i].t.slice(0, 8);
      if (!/^\d{8}$/.test(date) || !/^\d{8}$/.test(previousDate)) continue;
      const boundaryLength = isMin ? 8 : yearlyBoundaries ? 4 : 6;
      if (date.slice(0, boundaryLength) === previousDate.slice(0, boundaryLength)) continue;
      const xx = (mL + cw * i).toFixed(1);
      const separatorClass = isMin ? 'candle-day-separator' : yearlyBoundaries ? 'candle-year-separator' : 'candle-month-separator';
      const label = isMin ? `${date.slice(0,4)}-${date.slice(4,6)}-${date.slice(6,8)}` : yearlyBoundaries ? date.slice(0,4) : `${date.slice(0,4)}-${date.slice(4,6)}`;
      daySeparators += `<line class="${separatorClass}" data-date="${date}" x1="${xx}" x2="${xx}" y1="${mT}" y2="${H-mB}" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"><title>${label}</title></line>`;
    }
  }

  let body = '';
  items.forEach((d, i) => {
    const col = d.c >= d.o ? 'var(--pos)' : 'var(--neg)';
    const x = xc(i), yH = y(d.h), yL = y(d.l), yO = y(d.o), yC = y(d.c);
    const top = Math.min(yO, yC), bh = Math.max(1, Math.abs(yC - yO));
    body += `<line x1="${x.toFixed(1)}" y1="${yH.toFixed(1)}" x2="${x.toFixed(1)}" y2="${yL.toFixed(1)}" stroke="${col}" stroke-width="1"/>`;
    body += `<rect x="${(x-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}"/>`;
  });

  const averages = CHART_MAS.map(([period, color], index) => {
    const values = fullAverages[index].slice(start, end);
    const points = values.flatMap((value, i) => value === null ? [] : [`${xc(i).toFixed(1)},${y(value).toFixed(1)}`]);
    return points.length ? `<polyline data-ma="${period}" points="${points.join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>` : '';
  }).join('');
  const legend = CHART_MAS.map(([period, color]) =>
    `<span style="display:inline-flex;align-items:center;gap:4px"><span style="width:8px;border-top:2px solid ${color}"></span>${period}</span>`
  ).join('');
  const lastCandle = items[items.length - 1];
  const previousClose = lastCandle.previous_close;
  const comparable = Number.isFinite(previousClose) && previousClose > 0;
  const rising = comparable && lastCandle.c > previousClose;
  const falling = comparable && lastCandle.c < previousClose;
  const closeBackground = rising ? '#e5484d' : falling ? '#2563eb' : '#d1d5db';
  const closeForeground = rising || falling ? '#ffffff' : '#374151';
  const closeLabel = lastCandle.c.toLocaleString('ko-KR', { maximumFractionDigits: 0 });
  const closeFit = closeLabel.length > 7 ? ' textLength="50" lengthAdjust="spacingAndGlyphs"' : '';
  const closeY = Math.max(mT + 10, Math.min(priceH - mB - 10, y(lastCandle.c)));
  const closeMarker = `<g class="last-close-label" data-close="${lastCandle.c}">`
    + `<title>마지막 표시 봉 종가 ${closeLabel}원${comparable ? ' · 전일 종가 ' + previousClose.toLocaleString('ko-KR') + '원' : ''}</title>`
    + `<rect x="${mL+iw+3}" y="${(closeY-10).toFixed(1)}" width="${mR-3}" height="20" rx="3" fill="${closeBackground}"/>`
    + `<text x="${mL+iw+mR/2}" y="${(closeY+4).toFixed(1)}" font-size="11" fill="${closeForeground}" text-anchor="middle"${closeFit}>${closeLabel}</text></g>`;
  const amounts = items.map(item => Number.isFinite(item.amount_eok) ? item.amount_eok : null);
  const latestAmount = items[items.length - 1].amount_eok;
  const hasLatestAmount = Number.isFinite(latestAmount);
  const hasAmounts = amounts.some(value => value !== null);
  const amountTop = 338, amountBottom = H - 10, amountHeight = amountBottom - amountTop;
  // 1·2·5 계열의 정수 간격으로 눈금을 맞춘다 (예: 500억, 1,000억).
  const rawAmountMax = Math.max(1, ...amounts.filter(value => value !== null), hasLatestAmount ? latestAmount : 0);
  const targetStep = Math.max(1, rawAmountMax / 2);
  const magnitude = 10 ** Math.floor(Math.log10(targetStep));
  const amountStep = [1, 2, 5, 10].find(value => value * magnitude >= targetStep) * magnitude;
  const amountMax = Math.ceil(rawAmountMax / amountStep) * amountStep;
  const amountY = value => amountBottom - value / amountMax * amountHeight;
  const amountFmt = value => value.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
  let amountChart = '<g class="candle-amount" data-unit="억">'
    + `<line x1="${mL}" y1="309" x2="${mL+iw}" y2="309" stroke="#d5d8dd"/>`
    + `<text x="${mL}" y="328" font-size="12" fill="#6b7280">거래대금 (억${isMin ? ', 추정' : ''})${hasAmounts ? '' : ' · 미제공'}</text>`;
  if (hasAmounts) {
    for (let value = 0; value <= amountMax; value += amountStep) {
      const yy = amountY(value);
      amountChart += `<line x1="${mL}" y1="${yy.toFixed(1)}" x2="${mL+iw}" y2="${yy.toFixed(1)}" stroke="#eceef1"/>`
        + `<text x="${mL+iw+6}" y="${(yy+4).toFixed(1)}" font-size="11" fill="#000000">${value.toLocaleString('ko-KR', { maximumFractionDigits: 0 })}</text>`;
    }
    amounts.forEach((amount, i) => {
      if (amount === null) return;
      const color = items[i].c >= items[i].o ? 'var(--pos)' : 'var(--neg)';
      amountChart += `<rect data-amount="${amount}" data-time="${items[i].t}" x="${(xc(i)-bw/2).toFixed(1)}" y="${amountY(amount).toFixed(1)}" width="${bw.toFixed(1)}" height="${(amount / amountMax * amountHeight).toFixed(1)}" fill="${color}"><title>${fmt(items[i].t)} 거래대금 ${amountFmt(amount)}억</title></rect>`;
    });
  }
  if (hasLatestAmount) {
    const labelY = amountY(latestAmount);
    const label = latestAmount.toLocaleString('ko-KR', { maximumFractionDigits: 0 });
    const fit = label.length > 7 ? ' textLength="50" lengthAdjust="spacingAndGlyphs"' : '';
    amountChart += `<g class="current-amount-label" data-amount="${latestAmount}">`
      + `<title>마지막 표시 봉 거래대금 ${amountFmt(latestAmount)}억</title>`
      + `<rect x="${mL+iw+3}" y="${(labelY-10).toFixed(1)}" width="${mR-3}" height="20" rx="3" fill="#d1d5db"/>`
      + `<text x="${mL+iw+mR/2}" y="${(labelY+4).toFixed(1)}" font-size="11" fill="#374151" text-anchor="middle"${fit}>${label}</text></g>`;
  }
  amountChart += '</g>';

  // 터치 대상은 유지하고 SVG 내용만 갱신해 연속 핀치 동작이 끊기지 않게 한다.
  if (!host.querySelector('.candle-plot')) {
    host.innerHTML = '<div class="candle-legend" style="display:flex;flex-wrap:wrap;gap:12px;padding:0 8px;font-size:12px;line-height:15px" aria-label="종가 기준 이동평균선"></div>'
      + `<div class="candle-plot"><svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto"></svg><div class="candle-touch-layer" aria-hidden="true"></div></div>`;
  }
  host.querySelector('.candle-legend').innerHTML = legend;
  const svg = host.querySelector('svg');
  svg.dataset.visibleCandles = n;
  svg.innerHTML = grid + daySeparators + body + averages + xlab + closeMarker + amountChart;
}

let candleItems = [], candleHistory = [], candleNext = '', candleCont = 'N';
let candleGeneration = 0, candleLoading = false;
function updateCandleMore() {
  const btn = document.getElementById('chart-more');
  btn.disabled = candleLoading || (!candleHistory.length && !(candleCont === 'Y' && candleNext));
  btn.textContent = candleLoading ? '불러오는 중…' : '추가조회';
}
async function loadCandles(more = false) {
  if (more && (candleLoading || (!candleHistory.length && !(candleCont === 'Y' && candleNext)))) return;
  const generation = more ? candleGeneration : ++candleGeneration;
  const code = chartCode, tf = chartTf;
  const host = document.getElementById('stock-chart');
  if (!more) {
    candleItems = []; candleHistory = []; candleNext = ''; candleCont = 'N';
    candleViewCount = null; candleViewOffset = 0;
  }
  candleLoading = true; updateCandleMore();
  try {
    if (!code) { host.innerHTML = '<div class="empty">종목을 클릭하거나 코드를 입력하세요.</div>'; return; }
    let data;
    if (more && candleHistory.length) {
      data = { items: candleHistory, cont: candleCont, next: candleNext };
    } else {
      let url = '/api/candles?code=' + encodeURIComponent(code) + '&tf=' + tf;
      if (more) url += '&cont=Y&next=' + encodeURIComponent(candleNext);
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      data = await res.json();
      if (data.error) throw new Error(data.error);
    }
    if (generation !== candleGeneration) return;
    const merged = new Map((more ? candleItems : []).map(item => [item.t, item]));
    (data.items || []).forEach(item => merged.set(item.t, item));
    candleItems = [...merged.values()].sort((a, b) => a.t.localeCompare(b.t));
    candleHistory = data.history || [];
    candleCont = data.cont || 'N'; candleNext = data.next || '';
    document.getElementById('chart-name').textContent = '';
    drawCandles(candleItems, tf);
  } catch (e) {
    if (generation === candleGeneration) document.getElementById('chart-name').textContent = '차트 조회 실패: ' + e.message;
  } finally {
    if (generation === candleGeneration) { candleLoading = false; updateCandleMore(); }
  }
}

// 두 손가락은 확대/축소, 한 손가락 가로 움직임은 표시 기간 이동.
(function () {
  const host = document.getElementById('stock-chart');
  let pinch = null, pan = null, frame = null;
  const distance = touches => Math.hypot(touches[0].clientX - touches[1].clientX,
                                        touches[0].clientY - touches[1].clientY);
  const redraw = () => {
    if (frame !== null) return;
    const generation = candleGeneration;
    frame = requestAnimationFrame(() => {
      frame = null;
      if (generation === candleGeneration) drawCandles(candleItems, chartTf);
    });
  };
  const beginPan = touch => {
    const rect = host.querySelector('svg').getBoundingClientRect();
    pan = { x: touch.clientX, y: touch.clientY, offset: candleViewOffset,
            count: candleViewCount || candleItems.length, width: rect.width * 688 / 760,
            horizontal: false, generation: candleGeneration };
  };
  host.addEventListener('touchstart', event => {
    if (candleItems.length < 2 || !event.target.closest('.candle-plot')) return;
    if (event.touches.length === 1) { beginPan(event.touches[0]); return; }
    pan = null;
    if (event.touches.length !== 2) { pinch = null; return; }
    const gap = distance(event.touches);
    if (gap < 1) return;
    event.preventDefault();
    const rect = host.querySelector('svg').getBoundingClientRect();
    const center = (event.touches[0].clientX + event.touches[1].clientX) / 2;
    const fraction = Math.max(0, Math.min(1, ((center - rect.left) / rect.width * 760 - 8) / 688));
    const count = Math.min(candleViewCount || candleItems.length, candleItems.length);
    const end = candleItems.length - candleViewOffset;
    pinch = { gap, count, fraction, anchor: end - count + count * fraction, generation: candleGeneration };
  }, { passive: false });
  // 차트를 다시 그려도 터치 대상과 진행 중인 제스처는 유지한다.
  document.addEventListener('touchmove', event => {
    if (pinch) {
      if (event.touches.length !== 2 || pinch.generation !== candleGeneration) { pinch = null; return; }
      event.preventDefault();
      const gap = distance(event.touches);
      if (gap < 1) return;
      const total = candleItems.length;
      const count = Math.max(Math.min(10, total), Math.min(total, Math.round(pinch.count * pinch.gap / gap)));
      const end = Math.max(count, Math.min(total, Math.round(pinch.anchor + count * (1 - pinch.fraction))));
      candleViewCount = count === total ? null : count;
      candleViewOffset = total - end;
      redraw();
      return;
    }
    if (!pan) return;
    if (event.touches.length !== 1 || pan.generation !== candleGeneration) { pan = null; return; }
    const dx = event.touches[0].clientX - pan.x, dy = event.touches[0].clientY - pan.y;
    if (!pan.horizontal) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 8) return;
      if (Math.abs(dy) >= Math.abs(dx)) { pan = null; return; } // 세로는 페이지 스크롤
      pan.horizontal = true;
    }
    event.preventDefault();
    candleViewOffset = Math.max(0, Math.min(candleItems.length - pan.count,
      pan.offset + Math.round(dx / pan.width * pan.count)));
    redraw();
  }, { passive: false });
  document.addEventListener('touchend', event => {
    const active = pinch || pan;
    pinch = null; pan = null;
    if (active && event.touches.length === 1 && candleItems.length >= 2) beginPan(event.touches[0]);
  }, { passive: true });
  document.addEventListener('touchcancel', () => { pinch = null; pan = null; }, { passive: true });
})();

function setChartStock(code, name) {
  chartCode = (code || '').split('_')[0].replace(/\D/g, '').slice(0, 6);
  chartName = name || '';
  try { localStorage.setItem('stock_chart_code', chartCode); } catch (e) {}
  restoreStockInput(chartCode, chartName, 'stock_chart_code', 'chart-code');
  const nm = document.getElementById('chart-name'); if (nm) nm.textContent = '';
  return loadCandles();
}

async function resolveChart(raw) {
  const v = (raw || '').trim();
  if (!v) return;
  const digits = v.replace(/\D/g, '');
  if (digits.length === 6) { setChartStock(digits, ''); return; }
  try {
    const res = await fetch('/api/stock?q=' + encodeURIComponent(v), { cache: 'no-store' });
    if (!res.ok) return;
    const d = await res.json();
    if (d && d.code) setChartStock(d.code, d.name || '');
    else { const nm = document.getElementById('chart-name'); if (nm) nm.textContent = `"${v}" 종목을 찾지 못했습니다`; }
  } catch (e) {}
}

(function () {
  const go = document.getElementById('chart-go'), inp = document.getElementById('chart-code');
  if (!go || !inp) return;
  document.getElementById('chart-more').addEventListener('click', () => loadCandles(true));
  go.addEventListener('click', () => resolveChart(inp.value));
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') resolveChart(inp.value); });
})();

// ── 하단: 특정 종목 프로그램 순매수금액 차트 ──
let progStk = (function () {
  try { return localStorage.getItem('netprps_prog_stk') || '005930'; } catch (e) { return '005930'; }
})();

function drawProgramChart(series) {
  const host = document.getElementById('prog-chart');
  if (!series || series.length < 2) { host.innerHTML = '<div class="empty">데이터가 없습니다(장중에 조회하세요).</div>'; return; }
  const W = 760, H = 280, mL = 8, mR = 70, mT = 22, mB = 24;
  const iw = W - mL - mR, ih = H - mT - mB;
  const GREEN = '#16a34a';

  // 메인: 시간별 순매수금액(누적) 라인
  const vals = series.map(s => s.net);
  let vmin = Math.min(0, ...vals), vmax = Math.max(0, ...vals);
  if (vmin === vmax) vmax = vmin + 1;
  const pad = (vmax - vmin) * 0.08; vmin -= pad; vmax += pad;
  const n = series.length;
  const x = i => mL + iw * i / (n - 1);
  const y = v => mT + ih * (1 - (v - vmin) / (vmax - vmin));

  const ticks = 5; let grid = '';
  for (let k = 0; k <= ticks; k++) {
    const v = vmin + (vmax - vmin) * k / ticks, yy = y(v);
    grid += `<line x1="${mL}" y1="${yy}" x2="${mL+iw}" y2="${yy}" stroke="#eceef1"/>`;
    grid += `<text x="${mL+iw+6}" y="${yy+4}" font-size="11" fill="#000000">${Math.round(v).toLocaleString()}</text>`;
  }
  if (vmin < 0 && vmax > 0) grid += `<line x1="${mL}" y1="${y(0).toFixed(1)}" x2="${mL+iw}" y2="${y(0).toFixed(1)}" stroke="#c7ccd2"/>`;

  // X축: 10분 간격 세로선 + 라벨(라벨은 겹치지 않게 최소 간격 유지)
  let xlab = '', vlines = '', prevBucket = null, lastLabelX = -999;
  series.forEach((s, i) => {
    const mins = (+s.tm.slice(0,2)) * 60 + (+s.tm.slice(2,4));
    const bucket = Math.floor(mins / 10);
    if (bucket === prevBucket) return;
    prevBucket = bucket;
    const xi = x(i);
    vlines += `<line x1="${xi.toFixed(1)}" y1="${mT}" x2="${xi.toFixed(1)}" y2="${mT+ih}" stroke="#eceef1"/>`;
    if (xi - lastLabelX >= 44) {
      lastLabelX = xi;
      const bm = bucket * 10;
      const lbl = `${String((bm/60|0)).padStart(2,'0')}:${String(bm%60).padStart(2,'0')}`;
      xlab += `<text x="${xi.toFixed(1)}" y="${H-7}" font-size="10" fill="#000000" text-anchor="middle">${lbl}</text>`;
    }
  });

  let line = '';
  series.forEach((s, i) => line += `${i === 0 ? 'M' : 'L'}${x(i).toFixed(1)},${y(s.net).toFixed(1)} `);

  // 오버레이: 순매수금액증감 — 상단 밴드의 0선을 기준으로 얇은 막대(빨강+/파랑-)
  const chgs = series.map(s => s.chg || 0);
  const cmax = Math.max(1, ...chgs.map(Math.abs));
  const bandH = ih * 0.16, bandY0 = mT + bandH;      // 상단 밴드 0선
  // 증감 막대: 점마다 <line> 대신 상승/하락 각각 하나의 <path>로 합쳐 요소 수를 최소화(성능)
  let upSp = '', dnSp = '';
  series.forEach((s, i) => {
    const c = s.chg || 0; if (!c) return;
    const h = (Math.abs(c) / cmax) * bandH;
    const seg = `M${x(i).toFixed(1)},${bandY0.toFixed(1)}L${x(i).toFixed(1)},${(c > 0 ? bandY0 - h : bandY0 + h).toFixed(1)}`;
    if (c > 0) upSp += seg; else dnSp += seg;
  });
  const spikes =
    (dnSp ? `<path d="${dnSp}" stroke="var(--neg)" stroke-width="0.7" opacity="0.7"/>` : '')
    + (upSp ? `<path d="${upSp}" stroke="var(--pos)" stroke-width="0.7" opacity="0.7"/>` : '');

  const netLbl = progAmt === '2' ? '순매수수량' : '순매수금액';
  const chgLbl = progAmt === '2' ? '순매수수량증감' : '순매수금액증감';
  const legend = `<g font-size="11">`
    + `<rect x="${mL}" y="6" width="10" height="3" fill="${GREEN}"/><text x="${mL+14}" y="9.5" fill="#6b7280">시간별 ${netLbl}</text>`
    + `<rect x="${mL+130}" y="6" width="10" height="3" fill="var(--neg)"/><text x="${mL+144}" y="9.5" fill="#6b7280">${chgLbl}</text></g>`;

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto">`
    + grid + vlines + spikes
    + `<path d="${line}" fill="none" stroke="${GREEN}" stroke-width="1.6"/>`
    + xlab + legend + '</svg>';
}

let progSeries = {};          // tm -> point (버튼 연속조회로 누적)

let progAmt = (function () { try { return localStorage.getItem('netprps_prog_amt') || '1'; } catch (e) { return '1'; } })();  // 1:금액 2:수량
const progUnit = () => progAmt === '2' ? '주' : '백만원';
let progDomMin = null, progDomMax = null;   // 표에 그려진 tm 범위(증분 렌더용)
let progLoading = false;                     // 연속조회 진행 중(중복 방지)
let progStop = false;                        // 전체 연속조회 중단 요청

const progTf = tm => `${tm.slice(0,2)}:${tm.slice(2,4)}:${tm.slice(4,6)}`;
const progRowHtml = p => {
  const f = p.flu || 0;
  return `<tr><td class="tm">${progTf(p.tm)}</td>`
    + `<td class="${cls(f)}">${(p.cur || 0).toLocaleString('ko-KR')}</td>`
    + `<td class="${cls(f)}">${(f > 0 ? '+' : '') + f.toFixed(2)}%</td>`
    + `<td class="${cls(p.net)}">${fmtNet(p.net)}</td>`
    + `<td class="${cls(p.chg || 0)}">${fmtNet(p.chg || 0)}</td></tr>`;
};

// 증분 렌더: 전체 재구성 없이 새 행만 위/아래로 추가 (연속조회가 쌓여도 빠름)
function drawProgramTable(series) {
  const host = document.getElementById('prog-table');
  if (!series.length) { host.innerHTML = ''; progDomMin = progDomMax = null; return; }
  let tbody = host.querySelector('.prog-tbl tbody');
  if (!tbody) {
    const netLbl = progAmt === '2' ? '순매수수량' : '순매수금액';
    const chgLbl = '증감';
    host.innerHTML = '<div class="prog-tscroll"><table class="prog-tbl"><thead><tr>'
      + `<th>시간</th><th>현재가</th><th>등락률</th><th>${netLbl}</th><th>${chgLbl}</th></tr></thead><tbody></tbody></table></div>`;
    tbody = host.querySelector('.prog-tbl tbody');
    host.querySelector('.prog-tscroll').addEventListener('scroll', onProgScroll);  // 바닥 도달 시 자동 연속조회
    progDomMin = progDomMax = null;
  }
  const scroll = host.querySelector('.prog-tscroll');
  if (progDomMax === null) {                         // 최초: 전체(최신이 위)
    tbody.innerHTML = [...series].reverse().map(progRowHtml).join('');
    progDomMin = series[0].tm; progDomMax = series[series.length - 1].tm;
    return;
  }
  const newer = series.filter(p => p.tm > progDomMax);   // 더 최신 → 위로 prepend
  if (newer.length) {
    tbody.insertAdjacentHTML('afterbegin', [...newer].reverse().map(progRowHtml).join(''));
    progDomMax = newer[newer.length - 1].tm;
  }
  const older = series.filter(p => p.tm < progDomMin);   // 더 과거 → 아래로 append
  if (older.length) {
    const prevTop = scroll.scrollTop;
    tbody.insertAdjacentHTML('beforeend', [...older].reverse().map(progRowHtml).join(''));
    scroll.scrollTop = prevTop + 200;                   // 연속조회 시 새로 불러온 아래쪽으로 조금 이동
    progDomMin = older[0].tm;
  }
}

function progRedraw() {
  const sorted = Object.values(progSeries).sort((a, b) => a.tm < b.tm ? -1 : 1);
  drawProgramChart(sorted);
  drawProgramTable(sorted);
  const moreBtn = document.getElementById('prog-more');
  const canMore = progCont === 'Y' && !!progNext;
  moreBtn.disabled = !canMore;

}

function progMerge(series) {
  (series || []).forEach(p => { progSeries[p.tm] = p; });
}

// 최신 페이지 갱신(매분/조회): 누적은 유지, 커서는 최초 1회만 설정
async function renderProgram() {
  try {
    const res = await fetch('/api/program?stk=' + encodeURIComponent(progStk) + '&amt=' + progAmt, { cache: 'no-store' });
    if (!res.ok) return;
    const d = await res.json();
    document.getElementById('prog-name').textContent = '';
    progMerge(d.series);
    if (!progInited) { progCont = d.cont || 'N'; progNext = d.next || ''; progInited = true; }
    progRedraw();
  } catch (e) {}
}

// 연속조회 버튼: 다음(과거) 페이지를 이어받아 누적
async function loadMoreProgram() {
  if (progLoading || progCont !== 'Y' || !progNext) return;
  progLoading = true;
  const btn = document.getElementById('prog-more');
  btn.disabled = true; btn.textContent = '불러오는 중…';
  try {

      + '&amt=' + progAmt + '&cont=Y&next=' + encodeURIComponent(progNext);
    const res = await fetch(url, { cache: 'no-store' });
    if (res.ok) {
      const d = await res.json();
      progMerge(d.series);
      progCont = d.cont || 'N'; progNext = d.next || '';
    }
  } catch (e) {}
  btn.textContent = '연속조회';

}

// 연속조회 버튼: 끝(cont='N')까지 모든 페이지를 자동으로 이어 받음
async function loadAllProgram() {
  if (progLoading || progCont !== 'Y' || !progNext) return;
  progLoading = true; progStop = false;
  const btn = document.getElementById('prog-more');
  let page = 0, retry = 0;
  try {
    while (progCont === 'Y' && progNext && !progStop) {
      const url = '/api/program?stk=' + encodeURIComponent(progStk)
        + '&amt=' + progAmt + '&cont=Y&next=' + encodeURIComponent(progNext);
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) {                                 // 429 등: 잠깐 쉬고 재시도
        let bodyTxt = '';
        try { bodyTxt = (await res.text()).slice(0, 200); } catch (e) {}
        console.warn(`[연속조회] HTTP ${res.status} (page ${page + 1}, retry ${retry})`, bodyTxt);
        if (res.status === 429 && retry < 5) { retry++; await new Promise(r => setTimeout(r, 700)); continue; }
        console.error(`[연속조회] 중단 — HTTP ${res.status}`);
        break;
      }
      retry = 0;
      const d = await res.json();
      page++;
      if (d.error) console.error(`[연속조회] page ${page} 서버오류:`, d.error);
      console.log(`[연속조회] page ${page} OK · 건수 ${d.series ? d.series.length : 0} · cont ${d.cont} · next ${d.next ? d.next.slice(0, 12) + '…' : '(없음)'}`);
      progMerge(d.series);
      progCont = d.cont || 'N'; progNext = d.next || '';
      btn.textContent = '불러오는 중… (누르면 중단)';
      if (page % 3 === 0) progRedraw();              // 진행 표시(3페이지마다 갱신)
      // 페이지 간 지연 없음(응답이 모두 200이라 즉시 연속 요청). 429 발생 시 위에서 백오프.
    }
    console.log(`[연속조회] 완료 · 총 ${page}페이지 · cont ${progCont}${progStop ? ' · 사용자중단' : ''}`);
  } catch (e) { console.error('[연속조회] 예외:', e); }
  progLoading = false; progStop = false;
  btn.textContent = '연속조회';
  progRedraw();
}

function loadProgStock(code, name = '') {
  const v = (code || '').replace(/\D/g, '').slice(0, 6);
  if (!v) return;
  progStk = v;
  try { localStorage.setItem('netprps_prog_stk', v); } catch (e) {}
  restoreStockInput(v, name, 'netprps_prog_stk', 'prog-stk');
  progReset();
  return renderProgram();
}

// 입력값(종목코드 6자리 또는 종목명)으로 조회
async function resolveAndLoad(raw) {
  const v = (raw || '').trim();
  if (!v) return;
  if (/^\d{6}$/.test(v)) { loadProgStock(v); return; }
  const digits = v.replace(/\D/g, '');
  if (digits.length === 6) { loadProgStock(digits); return; }
  const nameEl = document.getElementById('prog-name');
  try {
    const res = await fetch('/api/stock?q=' + encodeURIComponent(v), { cache: 'no-store' });
    if (!res.ok) { nameEl.textContent = `검색 실패(HTTP ${res.status}) — 서버 재시작이 필요할 수 있습니다`; return; }
    const d = await res.json();
    if (d && d.code) loadProgStock(d.code, d.name || '');
    else nameEl.textContent = `"${v}" 종목을 찾지 못했습니다`;
  } catch (e) {
    nameEl.textContent = '검색 오류: ' + e.message;
  }
}

// 위에서 아래로 당기면 페이지 새로고침 (모바일 pull-to-refresh)
(function () {
  const ptr = document.getElementById('ptr');
  const txt = ptr.querySelector('.ptr-txt');
  const REST = -56, DAMP = 0.5, THRESH = 64, MAX = 90;   // px
  let startY = 0, dy = 0, pulling = false;
  const atTop = () => (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
  // 내부 스크롤(표 등)이 위가 아니면 그쪽 스크롤을 우선
  function inScrolled(el) {
    while (el && el !== document.body) {
      if (el.scrollHeight > el.clientHeight) {
        const oy = getComputedStyle(el).overflowY;
        if ((oy === 'auto' || oy === 'scroll') && el.scrollTop > 0) return true;
      }
      el = el.parentElement;
    }
    return false;
  }
  addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || !atTop() || inScrolled(e.target)) { pulling = false; return; }
    startY = e.touches[0].clientY; dy = 0; pulling = true;
    ptr.classList.remove('loading'); ptr.style.transition = 'none';
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (!pulling) return;
    dy = e.touches[0].clientY - startY;
    if (dy <= 0 || !atTop()) { pulling = false; ptr.style.transform = `translateY(${REST}px)`; return; }
    e.preventDefault();                                  // 당기는 동안 기본 오버스크롤 억제
    const pulled = Math.min(dy * DAMP, MAX);
    ptr.style.transform = `translateY(${REST + pulled}px)`;
    txt.textContent = pulled >= THRESH ? '놓으면 새로고침' : '당겨서 새로고침';
  }, { passive: false });
  addEventListener('touchend', () => {
    if (!pulling) return;
    pulling = false;
    ptr.style.transition = 'transform .25s ease';
    if (Math.min(dy * DAMP, MAX) >= THRESH) {
      ptr.classList.add('loading');
      txt.textContent = '새로고침 중…';
      ptr.style.transform = 'translateY(8px)';
      setTimeout(() => location.reload(), 150);
    } else {
      ptr.style.transform = `translateY(${REST}px)`;
    }
  }, { passive: true });
})();

    apply();
  });
})();

// 종목별 프로그램 순매수 접기/펼치기 (상태 유지, 기본 펼침)
(function () {
  const btn = document.getElementById('toggle-program');
  const box = document.getElementById('program-content');
  let collapsed = false;
  try { collapsed = localStorage.getItem('program_collapsed') === '1'; } catch (e) {}
  const apply = () => {
    box.hidden = collapsed;
    btn.textContent = collapsed ? '펼치기 ▸' : '접기 ▾';
    btn.setAttribute('aria-expanded', String(!collapsed));
  };
  apply();
  btn.addEventListener('click', () => {
    collapsed = !collapsed;
    try { localStorage.setItem('program_collapsed', collapsed ? '1' : '0'); } catch (e) {}
    apply();
  });
})();

// 종목 차트 접기/펼치기 (상태 유지, 기본 펼침)
(function () {
  const btn = document.getElementById('toggle-chart');
  const box = document.querySelector('.chart-wrap');
  const sel = document.getElementById('chart-tf');
  if (!btn || !box) return;
  let collapsed = true;   // 기본 접힘
  try { if (localStorage.getItem('stock_chart_collapsed') === '0') collapsed = false; } catch (e) {}
  const apply = () => {
    box.hidden = collapsed;
    if (sel) sel.style.display = collapsed ? 'none' : '';   // 접으면 봉 주기 선택도 숨김
    // 펼침: select(margin-left:auto)이 우측 정렬 담당 / 접힘: select 숨겨지므로 버튼이 담당
    btn.style.marginLeft = collapsed ? 'auto' : '0';
    btn.textContent = collapsed ? '펼치기 ▸' : '접기 ▾';
  };
  apply();
  btn.addEventListener('click', () => {
    collapsed = !collapsed;
    try { localStorage.setItem('stock_chart_collapsed', collapsed ? '1' : '0'); } catch (e) {}
    apply();
  });
})();

renderPuSide();     // 프로그램 상위: 순매수/순매도 선택 UI
renderPuMkt();      // 프로그램 상위: 시장 선택 UI
renderChartTf();    // 종목 차트: 봉 주기 선택 UI
if (chartCode) setChartStock(chartCode, '');   // 마지막 조회 종목 복원
refresh();          // 최초 즉시 1회
scheduleRefresh();  // 이후 매 분 :00+3초에 갱신
setInterval(renderPrmUpper, 5000);    // 프로그램 순매수 상위는 5초마다 별도 갱신
</script>
</body>
</html>
