<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지수 요약</title>
<style>
  :root {
    --bg:#f2f3f5; --text:#1c1f24; --muted:#8b8f97;
    --up:#e5322b; --down:#2563eb; --flat:#6b7280;
    --card-up:#fdf1ef; --card-down:#eef3fd; --card-flat:#f5f6f8;
    --line:#e3e5e9;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif; }
  .page-title { max-width:1040px; margin:0 auto 10px; display:flex; align-items:center; gap:10px; }
  .page-title h1 { font-size:18px; font-weight:700; margin:0; }
  .page-title a { margin-left:auto; font-size:13px; color:var(--muted); text-decoration:none;
    border:1px solid var(--line); border-radius:14px; padding:4px 12px; }
  #status { font-size:11px; color:var(--muted); }
  .cards { max-width:1040px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:680px){ .cards { grid-template-columns:1fr; } }
  .card { border-radius:22px; padding:22px 24px; background:var(--card-flat); }
  .card.up { background:var(--card-up); } .card.down { background:var(--card-down); }
  .card .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .card .name { font-size:22px; font-weight:700; color:#6b7078; }
  .card .price { font-size:40px; font-weight:800; line-height:1.05; margin-top:6px; }
  .card .flu { font-size:20px; font-weight:700; margin-top:2px; }
  .card.up .price, .card.up .flu { color:var(--up); }
  .card.down .price, .card.down .flu { color:var(--down); }
  .card.flat .price, .card.flat .flu { color:var(--flat); }
  .spark { width:190px; height:78px; flex:none; }
  @media (max-width:420px){ .spark { width:130px; height:64px; } }
  .divider { border:0; border-top:1px dashed #d6cfce; margin:18px 0 14px; }
  .card.down .divider { border-top-color:#cdd6e8; }
  .investors { display:grid; grid-template-columns:1fr 1fr 1fr; text-align:center; gap:8px; }
  .investors .lbl { font-size:15px; color:#8b8f97; margin-bottom:4px; }
  .investors .val { font-size:19px; font-weight:700; }
  .pos { color:var(--up); } .neg { color:var(--down); } .zero { color:var(--flat); }
  .empty { color:var(--muted); font-size:14px; padding:8px 0; }
</style>
</head>
<body>
<div class="page-title">
  <h1>지수 요약</h1>
  <span id="status">연결 중…</span>
  <a href="/">투자자 매매동향 →</a>
</div>
<div class="cards" id="cards"></div>
<script>
const fmtIdx = v => (v == null) ? '-' : v.toLocaleString('ko-KR', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtFlu = v => (v == null) ? '' : (v > 0 ? '+' : '') + v.toFixed(2) + '%';
const fmtNet = v => (v == null) ? '-' : (v > 0 ? '+' : '') + v.toLocaleString('ko-KR');
const dirClass = flu => flu > 0 ? 'up' : (flu < 0 ? 'down' : 'flat');
const valClass = v => v > 0 ? 'pos' : (v < 0 ? 'neg' : 'zero');

function sparkline(series, prev, flu) {
  const W = 190, H = 78, pad = 6;
  if (!series || series.length < 2) return `<svg class="spark" viewBox="0 0 ${W} ${H}"></svg>`;
  const vals = series.map(s => s.idx);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (prev != null) { lo = Math.min(lo, prev); hi = Math.max(hi, prev); }
  if (lo === hi) hi = lo + 1;
  const n = series.length;
  const x = i => pad + (W - pad*2) * i / (n - 1);
  const y = v => pad + (H - pad*2) * (1 - (v - lo) / (hi - lo));
  const color = flu > 0 ? 'var(--up)' : (flu < 0 ? 'var(--down)' : 'var(--flat)');
  let d = '', area = '';
  series.forEach((s, i) => { const cmd = i === 0 ? 'M' : 'L'; d += `${cmd}${x(i).toFixed(1)},${y(s.idx).toFixed(1)} `; });
  area = d + `L${x(n-1).toFixed(1)},${H-pad} L${x(0).toFixed(1)},${H-pad} Z`;
  let base = '';
  if (prev != null) { const yb = y(prev).toFixed(1); base = `<line x1="${pad}" y1="${yb}" x2="${W-pad}" y2="${yb}" stroke="#c7ccd2" stroke-width="1" stroke-dasharray="3 3"/>`; }
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`
    + `<path d="${area}" fill="${color}" opacity="0.10"/>`
    + base
    + `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>`
    + `</svg>`;
}

function card(m) {
  const dc = dirClass(m.flu);
  const spark = sparkline(m.series, m.pred, m.flu);
  const inv = [['개인', m.ind], ['외국인', m.frgnr], ['기관', m.orgn]]
    .map(([l, v]) => `<div><div class="lbl">${l}</div><div class="val ${valClass(v)}">${fmtNet(v)}</div></div>`).join('');
  const hasData = m.idx != null;
  return `<div class="card ${dc}">
    <div class="top">
      <div>
        <div class="name">${m.name}</div>
        ${hasData ? `<div class="price">${fmtIdx(m.idx)}</div><div class="flu">(${fmtFlu(m.flu)})</div>`
                  : `<div class="empty">데이터 수집 대기 중…</div>`}
      </div>
      ${spark}
    </div>
    <hr class="divider">
    <div class="investors">${inv}</div>
  </div>`;
}

async function refresh() {
  const st = document.getElementById('status');
  try {
    const res = await fetch('/api/summary', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    document.getElementById('cards').innerHTML = data.markets.map(card).join('');
    st.textContent = '갱신 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    st.textContent = '연결 실패: ' + e.message;
  }
}

const OFFSET = 3000;
function schedule() {
  const now = Date.now();
  const next = Math.floor(now / 60000) * 60000 + 60000 + OFFSET;
  setTimeout(() => { refresh(); schedule(); }, next - now);
}
refresh();
schedule();
</script>
</body>
</html>
