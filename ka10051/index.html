<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>투자자별 매매동향</title>
<style>
  :root {
    --bg:#f2f3f5; --panel:#fff; --line:#d5d8dd; --text:#1c1f24;
    --muted:#6b7280; --head:#eef0f3; --pos:#e5484d; --neg:#2563eb; --sel:#dbeafe;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif; }
  .wrap { display:grid; grid-template-columns:1fr; gap:14px; max-width:1200px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .title { padding:10px 14px; font-size:14px; font-weight:600; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .title small { color:var(--muted); font-weight:400; }
  .toggle-controls { font-size:12px; font-weight:600; color:var(--muted); background:none;
    border:1px solid var(--line); border-radius:12px; padding:3px 10px; cursor:pointer; }
  .controls.collapsed { display:none; }
  table { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  th,td { padding:5px 9px; text-align:right; border-bottom:1px solid #eceef1; }
  th { background:var(--head); color:var(--muted); font-weight:600; position:sticky; top:0; }
  .ntable th:first-child, .ntable td:first-child { text-align:center; color:var(--muted);
    position:sticky; left:0; background:var(--panel); z-index:1; }
  .ntable th:first-child { z-index:2; background:var(--head); }
  .summary td { font-weight:600; }
  .summary td:first-child { background:#f6f7f9; }
  /* 증감 행 강조 배경 */
  .summary.delta td { background:var(--sel); }
  /* 매분 갱신 시 번쩍임 */
  .summary.delta.flash td { animation:deltaFlash .9s ease-out; }
  @keyframes deltaFlash {
    0%   { background:#ffd54a; }
    60%  { background:#ffe9a6; }
    100% { background:var(--sel); }
  }
  /* 표를 두 개로 분리: 위(head-table)=헤더+순매수+증감 고정, 아래(body-scroll)=시간 행 스크롤 */
  .head-table { border-bottom:2px solid #9aa0a8; box-shadow:0 3px 4px -2px rgba(0,0,0,.12); }
  .body-scroll { max-height:200px; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch; touch-action:pan-y; overscroll-behavior:contain; }
  .head-table, .body-table { table-layout:fixed; }
  tr.moretip td { text-align:center; color:var(--muted); font-size:11px; padding:8px;
    background:#fafbfc; position:static; }
  .pos { color:var(--pos); } .neg { color:var(--neg); }
  .legend { display:flex; gap:16px; padding:8px 14px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
  .legend b { font-weight:600; }
  .legend i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px; }
  svg { display:block; width:100%; height:auto; }
  .empty { padding:40px; text-align:center; color:var(--muted); font-size:13px; }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:6px 4px; padding:10px 12px; }
  .controls .chk { display:inline-flex; align-items:center; gap:5px; font-size:12px; cursor:pointer;
    padding:3px 8px; border:1px solid var(--line); border-radius:14px; user-select:none; background:#fafbfc; }
  .controls .chk input { margin:0; cursor:pointer; }
  .controls .chk .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .controls .chk.off { opacity:.45; }
  .controls .chk.disabled { opacity:.3; cursor:not-allowed; }
  .controls .chk.disabled input { cursor:not-allowed; }
  .controls .selnote { font-size:11px; color:var(--muted); }
  .controls .sep { width:1px; align-self:stretch; background:var(--line); margin:0 4px; }
  .controls .allbtn { font-size:11px; color:var(--muted); background:none; border:1px solid var(--line);
    border-radius:12px; padding:3px 9px; cursor:pointer; }
  .market-sel { display:inline-flex; gap:14px; font-size:14px; font-weight:600; }
  .market-sel label { display:inline-flex; align-items:center; gap:5px; cursor:pointer; color:var(--muted); }
  .market-sel label.on { color:var(--text); }
  .market-sel input { cursor:pointer; }
  .page-title { max-width:1200px; margin:20px auto 6px; font-size:18px; font-weight:700; color:var(--text);
    display:flex; align-items:center; gap:10px; }
  .page-title a { margin-left:auto; font-size:13px; font-weight:400; color:var(--muted);
    text-decoration:none; border:1px solid var(--line); border-radius:14px; padding:4px 12px; }
  /* 종목등락현황 표 (상한/상승/보합/하락/하한) */
  .breadth { max-width:1200px; margin:0 auto 12px; }
  .breadth-tbl { width:100%; border-collapse:collapse; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; overflow:hidden;
    font-size:14px; font-variant-numeric:tabular-nums; }
  .breadth-tbl th, .breadth-tbl td { padding:11px 8px; border-bottom:1px solid #eceef1; text-align:center; }
  .breadth-tbl thead th { background:var(--head); color:var(--text); font-weight:700; }
  .breadth-tbl tbody tr:last-child td { border-bottom:0; }
  .breadth-tbl td.mk { font-weight:700; color:var(--text); }
  .breadth-tbl td.num { font-weight:700; }
  .breadth-tbl .up { color:var(--pos); } .breadth-tbl .dn { color:var(--neg); } .breadth-tbl .flat { color:var(--muted); }
  .breadth-tbl .arw { font-size:11px; margin-left:3px; }
  .breadth-tbl .pct { color:var(--muted); font-weight:400; font-size:11px; }
  /* 조회수 상위 종목 */
  .rank-wrap { max-width:1200px; margin:0 auto 14px; }
  /* 접힘: 헤더+약 10행만 보이고 스크롤로 나머지 확인 / 펼침: 20행 모두 */
  .rank-scroll { max-height:352px; overflow-y:auto; }
  .rank-scroll.expanded { max-height:700px; }
  .rank-tbl { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  .rank-tbl th, .rank-tbl td { padding:6px 6px; border-bottom:1px solid #eceef1; text-align:right; white-space:nowrap; }
  .rank-tbl thead th { background:var(--head); color:var(--muted); font-weight:600; position:sticky; top:0; z-index:1;
    white-space:normal; line-height:1.25; }
  .rank-tbl td.rk { text-align:center; color:var(--muted); width:40px; }
  .rank-tbl td.nm { text-align:left; font-weight:600; }
  .rank-tbl tbody tr { cursor:pointer; }
  .rank-tbl tbody tr:hover td { background:#f2f6ff; }
  .rank-tbl .pos { color:var(--pos); } .rank-tbl .neg { color:var(--neg); } .rank-tbl .zero { color:var(--muted); }
  .rank-tbl .rup { color:#16a34a; font-size:11px; margin-left:5px; }
  .rank-tbl .rdn { color:#e5484d; font-size:11px; margin-left:5px; }
  .rank-toggle { width:100%; border:0; border-top:1px solid var(--line); background:#fafbfc;
    color:var(--muted); font-size:12px; padding:8px; cursor:pointer; }
  /* 프로그램 순매수금액 */
  .prog-wrap { max-width:1200px; margin:0 auto 16px; }
  .prog-input { width:96px; font-size:13px; padding:4px 8px; border:1px solid var(--line);
    border-radius:8px; font-variant-numeric:tabular-nums; }
  .prog-go { font-size:12px; padding:5px 12px; border:1px solid var(--line); border-radius:12px;
    background:var(--head); cursor:pointer; }
  .prog-go:disabled { opacity:.4; cursor:default; }
  .prog-name { font-size:14px; font-weight:700; color:var(--text); }
  .prog-unit { margin-left:auto; color:var(--muted); font-weight:400; }
  .prog-tscroll { max-height:280px; overflow:auto; border-top:1px solid var(--line); margin-top:8px; }
  .prog-tbl { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; }
  .prog-tbl th, .prog-tbl td { padding:5px 10px; border-bottom:1px solid #eceef1; text-align:right; white-space:nowrap; }
  .prog-tbl thead th { background:var(--head); color:var(--muted); font-weight:600; position:sticky; top:0; }
  .prog-tbl td.tm { text-align:center; color:var(--muted); }
  .prog-tbl .pos { color:var(--pos); } .prog-tbl .neg { color:var(--neg); } .prog-tbl .zero { color:var(--muted); }
  @media (max-width:560px){ .breadth-tbl { font-size:12px; } .breadth-tbl th, .breadth-tbl td { padding:9px 4px; } }
  /* 상단 지수 요약 카드 (모바일에서도 좌우 2단 유지) */
  .mkt-cards { max-width:1200px; margin:0 auto 14px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .mkt-card { border-radius:18px; padding:16px 18px; background:#f5f6f8; min-width:0; }
  .mkt-card.up { background:#fdf1ef; } .mkt-card.down { background:#eef3fd; }
  /* 두 시장 비교: 더 강한 상승은 더 빨갛게, 더 약한(더 낮은) 하락은 더 파랗게 */
  .mkt-card.up.strong { background:#fadfd9; } .mkt-card.down.strong { background:#e1e9fb; }
  .mkt-card .top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .mkt-card .nm { font-size:16px; font-weight:700; color:#6b7078; }
  .mkt-card .px { font-size:19px; font-weight:800; line-height:1.1; margin-top:2px; }
  .mkt-card .fl { font-size:12px; font-weight:700; }
  .mkt-card.up .px, .mkt-card.up .fl { color:var(--pos); }
  .mkt-card.down .px, .mkt-card.down .fl { color:var(--neg); }
  .mkt-card.flat .px, .mkt-card.flat .fl { color:var(--muted); }
  .mkt-card .spark { width:150px; height:56px; flex:none; }
  /* 좁은 화면: 2단을 유지하며 카드 내부를 압축 */
  @media (max-width:560px){
    .mkt-cards { gap:8px; }
    .mkt-card { padding:12px 12px; border-radius:14px; }
    .mkt-card .top { gap:8px; }
    .mkt-card .top > div { min-width:0; }
    .mkt-card .nm { font-size:13px; }
    .mkt-card .px { font-size:17px; }
    .mkt-card .fl { font-size:12px; }
    .mkt-card .spark { width:auto; flex:1 1 40px; min-width:40px; height:42px; }  /* 남는 폭에 맞춰 축소 */
    .mkt-card .inv .l { font-size:11px; }
    .mkt-card .inv .v { font-size:12px; }
  }
  @media (max-width:360px){ .mkt-card .spark { height:38px; } }
  .mkt-card .dv { border:0; border-top:1px dashed #d6cfce; margin:12px 0 10px; }
  .mkt-card.down .dv { border-top-color:#cdd6e8; }
  .mkt-card .inv { display:grid; grid-template-columns:1fr 1fr 1fr; text-align:center; gap:6px; }
  .mkt-card .inv .l { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .mkt-card .inv .v { font-size:12px; font-weight:700; }
  .zero { color:var(--muted); }
</style>
</head>
<body>
<div class="page-title"><span>지수현황</span></div>
<div class="mkt-cards" id="mkt-cards"></div>
<div class="page-title"><span>종목등락현황</span></div>
<div class="breadth" id="breadth"></div>
<div class="page-title"><span>투자자별 매매동향</span></div>
<div class="wrap">
  <div class="panel">
    <div class="title">
      <span class="market-sel" id="market-sel"></span>
      <button class="toggle-controls" id="toggle-controls" type="button">투자자 선택 ▾</button>
    </div>
    <div class="controls" id="controls"></div>
  </div>
  <div class="panel">
    <div class="title">누적 순매수 추이</div>
    <div class="legend" id="chart-legend"></div>
    <div id="chart-host"></div>
  </div>
  <div class="panel">
    <div class="title"><span id="label-lbl"></span> 순매수 <small id="date-lbl"></small></div>
    <div id="table-host"></div>
  </div>
</div>
<div class="page-title"><span>조회수 상위 종목</span></div>
<div class="rank-wrap">
  <div class="panel">
    <div id="rank-host"></div>
    <button id="rank-toggle" class="rank-toggle" type="button">펼치기 ▾</button>
  </div>
</div>
<div class="page-title"><span>종목별 프로그램 순매수</span></div>
<div class="prog-wrap">
  <div class="panel">
    <div class="title">
      <input id="prog-stk" class="prog-input" value="005930" maxlength="6" inputmode="numeric" placeholder="종목코드">
      <button id="prog-go" class="prog-go" type="button">조회</button>
      <span class="market-sel" id="prog-amt">
        <label class="on"><input type="radio" name="progamt" value="1" checked>금액</label>
        <label><input type="radio" name="progamt" value="2">수량</label>
      </span>
      <span id="prog-name" class="prog-name"></span>
      <small class="prog-unit" id="prog-count"></small>
      <button id="prog-more" class="prog-go" type="button" disabled>연속조회</button>
    </div>
    <div id="prog-table"></div>
    <div id="prog-chart"></div>
  </div>
</div>
<script>
let DATA = { date:null, label:'', columns:[], points:[], default_selected:[], markets:[] };
let selected = null;           // Set<key> — 표시할 투자자

const fmtSigned = v => (v > 0 ? '+' : '') + v.toLocaleString();
const cls = v => v > 0 ? 'pos' : (v < 0 ? 'neg' : '');
const LS_KEY = 'netprps_selected';
const LS_MARKET = 'netprps_market';

// 현재 선택 시장 (기본 kospi) — 최초 fetch 전에도 사용
let curMarket = (function () {
  try { return localStorage.getItem(LS_MARKET) || 'kospi'; } catch (e) { return 'kospi'; }
})();

function renderMarkets() {
  const host = document.getElementById('market-sel');
  host.innerHTML = (DATA.markets || []).map(m =>
    `<label class="${m.key === curMarket ? 'on' : ''}">`
    + `<input type="radio" name="mkt" value="${m.key}" ${m.key === curMarket ? 'checked' : ''}>${m.name}</label>`
  ).join('');
  host.querySelectorAll('input[name="mkt"]').forEach(r => {
    r.addEventListener('change', () => {
      curMarket = r.value;
      try { localStorage.setItem(LS_MARKET, curMarket); } catch (e) {}
      visibleCount = PAGE;                                   // 새 시장은 최신부터
      document.getElementById('table-host').innerHTML = '';  // 표 초기화
      refresh();
    });
  });
}

function loadSelected() {
  let set;
  try {
    const raw = localStorage.getItem(LS_KEY);
    set = raw ? new Set(JSON.parse(raw)) : new Set(DATA.default_selected || []);
  } catch (e) { set = new Set(DATA.default_selected || []); }
  // 최대 개수 초과 저장분은 앞에서부터 잘라냄
  if (set.size > MAX_SELECT) set = new Set([...set].slice(0, MAX_SELECT));
  return set;
}
function saveSelected() {
  try { localStorage.setItem(LS_KEY, JSON.stringify([...selected])); } catch (e) {}
}
// 선택된 컬럼(원래 순서 유지)
function activeCols() { return DATA.columns.filter(c => selected.has(c.key)); }

function renderControls() {
  const host = document.getElementById('controls');
  const full = selected.size >= MAX_SELECT;   // 최대 도달 시 미선택 항목 비활성화
  let html = '';
  DATA.columns.forEach(c => {
    const on = selected.has(c.key);
    const disabled = !on && full;
    html += `<label class="chk ${on ? '' : 'off'}${disabled ? ' disabled' : ''}" data-key="${c.key}">`
      + `<input type="checkbox" ${on ? 'checked' : ''} ${disabled ? 'disabled' : ''}>`
      + `<span class="dot" style="background:${c.color}"></span>${c.name}</label>`;
  });
  html += '<span class="sep"></span>'
    + `<span class="selnote">${selected.size}/${MAX_SELECT}</span>`
    + '<button class="allbtn" data-act="none">해제</button>';
  host.innerHTML = html;

  host.querySelectorAll('.chk').forEach(el => {
    el.addEventListener('change', () => {
      const key = el.dataset.key;
      const checked = el.querySelector('input').checked;
      if (checked) {
        if (selected.size >= MAX_SELECT) { renderControls(); return; }  // 초과 방지
        selected.add(key);
      } else {
        selected.delete(key);
      }
      saveSelected(); renderControls(); renderTable(); renderChart();
    });
  });
  host.querySelector('.allbtn[data-act="none"]').addEventListener('click', () => {
    selected.clear();
    saveSelected(); renderControls(); renderTable(); renderChart();
  });
}

const PAGE = 10;        // 처음/추가로 불러오는 시간별 행 수
let visibleCount = PAGE;// 현재 표시 중인 시간별 행 수(최신부터, 스크롤로 증가)
const MAX_SELECT = 5;   // 투자자 최대 선택 수
let lastLatestT;        // 직전에 본 최신 시각(새 분 감지용)

function flashDelta() {
  const el = document.getElementById('delta-row');
  if (!el) return;
  el.classList.remove('flash');
  void el.offsetWidth;          // reflow 강제 → 애니메이션 재시작
  el.classList.add('flash');
}

function renderTable() {
  const host = document.getElementById('table-host');
  document.getElementById('label-lbl').textContent = DATA.label || '';
  document.getElementById('date-lbl').textContent = DATA.date ? `기준일 ${DATA.date}` : '';
  const pts = DATA.points, cols = activeCols();
  if (!pts.length) { host.innerHTML = '<div class="empty">아직 기록된 데이터가 없습니다.</div>'; return; }
  if (!cols.length) { host.innerHTML = '<div class="empty">위에서 투자자를 선택하세요.</div>'; return; }

  const last = pts[pts.length - 1];
  const prev = pts.length > 1 ? pts[pts.length - 2] : null;

  // 위쪽 고정 테이블 행들(헤더/순매수/증감)
  let headRows = '<tr class="hrow"><th>시간</th>';
  cols.forEach(c => headRows += `<th>${c.name}</th>`);
  headRows += '</tr><tr class="summary sum1"><td>순매수</td>';
  cols.forEach(c => headRows += `<td class="${cls(last[c.key])}">${fmtSigned(last[c.key])}</td>`);
  headRows += `</tr><tr class="summary delta sum2" id="delta-row"><td>증감</td>`;
  cols.forEach(c => {
    const d = prev ? last[c.key] - prev[c.key] : 0;
    headRows += `<td class="${cls(d)}">${fmtSigned(d)}</td>`;
  });
  headRows += '</tr>';

  // 아래쪽 시간 행들(최신 visibleCount개)
  const shown = Math.min(visibleCount, pts.length);
  const startIdx = pts.length - shown;
  let bodyRows = '';
  for (let i = pts.length - 1; i >= startIdx; i--) bodyRows += timeRowHtml(pts[i], cols);
  if (shown < pts.length) bodyRows += moretipHtml(pts.length - shown, cols.length);

  // 구조는 한 번만 생성하고, 이후에는 tbody 내용만 교체(스크롤 컨테이너 유지 → 관성 보존)
  let bscroll = host.querySelector('.body-scroll');
  const prevTop = bscroll ? bscroll.scrollTop : 0;
  if (!bscroll) {
    host.innerHTML =
      '<table class="ntable head-table"><colgroup></colgroup><tbody class="hbody"></tbody></table>'
      + '<div class="body-scroll"><table class="ntable body-table"><colgroup></colgroup><tbody class="bbody"></tbody></table></div>';
    bscroll = host.querySelector('.body-scroll');
    bscroll.addEventListener('scroll', onTableScroll);
  }
  host.querySelector('.hbody').innerHTML = headRows;
  host.querySelector('.bbody').innerHTML = bodyRows;
  syncColumnWidths(host, cols.length);
  bscroll.scrollTop = prevTop;
}

function timeRowHtml(p, cols) {
  return `<tr class="trow"><td>${p.t.slice(0,5)}</td>`
    + cols.map(c => `<td class="${cls(p[c.key])}">${fmtSigned(p[c.key])}</td>`).join('') + '</tr>';
}
function moretipHtml(remain, nCols) {
  return `<tr class="moretip"><td colspan="${nCols + 1}">아래로 스크롤하면 ${Math.min(PAGE, remain)}개 더 불러옵니다 (남은 ${remain}개)</td></tr>`;
}

// 스크롤로 더 볼 때는 전체 재렌더 없이 '새로 보이는 과거 행'만 아래에 append (버벅임 방지)
function appendOlderRows() {
  const host = document.getElementById('table-host');
  const bbody = host.querySelector('.bbody');
  if (!bbody) { renderTable(); return; }
  const pts = DATA.points, cols = activeCols();
  const rendered = bbody.querySelectorAll('tr.trow').length;
  const curStart = pts.length - rendered;                 // 현재 표시된 가장 오래된 인덱스
  const newStart = Math.max(0, pts.length - Math.min(visibleCount, pts.length));
  if (newStart >= curStart) return;                       // 추가할 것 없음
  let html = '';
  for (let i = curStart - 1; i >= newStart; i--) html += timeRowHtml(pts[i], cols);
  const mt = bbody.querySelector('.moretip');
  if (mt) mt.remove();
  bbody.insertAdjacentHTML('beforeend', html);
  if (newStart > 0) bbody.insertAdjacentHTML('beforeend', moretipHtml(newStart, cols.length));
}

// 두 테이블의 컬럼 너비를 맞춘다(스크롤바 폭까지 반영해 정렬).
function syncColumnWidths(host, nCols) {
  const bscroll = host.querySelector('.body-scroll');
  const W = bscroll.clientWidth;               // 세로 스크롤바 제외한 실제 폭
  const FIRST_W = 56;                          // '시간' 열 고정 폭
  const rest = Math.max(0, W - FIRST_W);
  const each = Math.floor(rest / nCols);
  const widths = [FIRST_W];
  for (let i = 0; i < nCols; i++) widths.push(i === nCols - 1 ? rest - each * (nCols - 1) : each);
  const cg = widths.map(w => `<col style="width:${w}px">`).join('');
  host.querySelectorAll('colgroup').forEach(el => el.innerHTML = cg);
  host.querySelectorAll('.ntable').forEach(t => t.style.width = W + 'px');
}

function onTableScroll(e) {
  const el = e.currentTarget;
  // 바닥 근처(120px)에 도달하면 과거 데이터 PAGE개 더 append (전체 재렌더 없이)
  if (el.scrollTop + el.clientHeight >= el.scrollHeight - 120) {
    if (visibleCount < DATA.points.length) {
      visibleCount += PAGE;
      appendOlderRows();
    }
  }
}

function renderChart() {
  const host = document.getElementById('chart-host');
  const pts = DATA.points, cols = activeCols();
  renderChartLegend(cols);
  if (!cols.length) { host.innerHTML = '<div class="empty">위에서 투자자를 선택하세요.</div>'; return; }

  const W = 760, H = 420, mL = 8, mR = 56, mT = 16, mB = 28;
  const iw = W - mL - mR, ih = H - mT - mB;

  let vmin = 0, vmax = 0;
  pts.forEach(p => cols.forEach(c => { vmin = Math.min(vmin, p[c.key]); vmax = Math.max(vmax, p[c.key]); }));
  if (vmin === vmax) vmax = vmin + 1;
  const pad = (vmax - vmin) * 0.08; vmin -= pad; vmax += pad;

  const n = pts.length;
  const x = i => mL + (n === 1 ? iw/2 : iw * i / (n - 1));
  const y = v => mT + ih * (1 - (v - vmin) / (vmax - vmin));

  const ticks = 6; let grid = '';
  for (let k = 0; k <= ticks; k++) {
    const v = vmin + (vmax - vmin) * k / ticks, yy = y(v);
    grid += `<line x1="${mL}" y1="${yy}" x2="${mL+iw}" y2="${yy}" stroke="#eceef1"/>`;
    grid += `<text x="${mL+iw+6}" y="${yy+4}" font-size="11" fill="#9aa0a8">${Math.round(v).toLocaleString()}</text>`;
  }
  if (vmin < 0 && vmax > 0) {
    const y0 = y(0);
    grid += `<line x1="${mL}" y1="${y0}" x2="${mL+iw}" y2="${y0}" stroke="#c7ccd2"/>`;
  }

  let xlab = ''; const step = Math.max(1, Math.floor(n / 6));
  for (let i = 0; i < n; i += step)
    xlab += `<text x="${x(i)}" y="${H-8}" font-size="10" fill="#9aa0a8" text-anchor="middle">${pts[i].t.slice(0,5)}</text>`;

  let lines = '';
  cols.forEach(c => {
    const d = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${x(i).toFixed(1)},${y(p[c.key]).toFixed(1)}`).join(' ');
    lines += `<path d="${d}" fill="none" stroke="${c.color}" stroke-width="1.8"/>`;
    lines += `<circle cx="${x(n-1)}" cy="${y(pts[n-1][c.key])}" r="2.6" fill="${c.color}"/>`;
  });

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">` + grid + lines + xlab + '</svg>';
}

// ── 상단 지수 요약 카드 ──
const fmtIdx = v => (v == null) ? '-' : v.toLocaleString('ko-KR', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtFlu = v => (v == null) ? '' : (v > 0 ? '+' : '') + v.toFixed(2) + '%';
const fmtNet = v => (v == null) ? '-' : (v > 0 ? '+' : '') + v.toLocaleString('ko-KR');

// 어제(회색) + 오늘(방향색) 지수 1분봉 종가 라인. 경계에 세로선, 전일종가에 점선.
function mktSpark(prevSeries, todaySeries, base, flu) {
  const W = 150, H = 56, pad = 5;
  const prev = prevSeries || [], today = todaySeries || [];
  const all = prev.concat(today);
  if (all.length < 2) return `<svg class="spark" viewBox="0 0 ${W} ${H}"></svg>`;
  const vals = all.map(s => s.idx);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (base != null) { lo = Math.min(lo, base); hi = Math.max(hi, base); }
  if (lo === hi) hi = lo + 1;
  const n = all.length, P = prev.length;
  const x = i => pad + (W - pad*2) * i / (n - 1);
  const y = v => pad + (H - pad*2) * (1 - (v - lo) / (hi - lo));
  const color = flu > 0 ? 'var(--pos)' : (flu < 0 ? 'var(--neg)' : 'var(--muted)');

  let gray = '';
  if (P > 0) for (let i = 0; i < P; i++) gray += `${i === 0 ? 'M' : 'L'}${x(i).toFixed(1)},${y(prev[i].idx).toFixed(1)} `;
  const cStart = P > 0 ? P - 1 : 0;   // 어제 마지막 점에서 이어 그림
  let colr = '';
  for (let i = cStart; i < n; i++) colr += `${i === cStart ? 'M' : 'L'}${x(i).toFixed(1)},${y(all[i].idx).toFixed(1)} `;

  // 오늘 구간 아래 영역 채움
  let area = '';
  if (today.length) {
    let a = `M${x(P).toFixed(1)},${(H-pad).toFixed(1)} `;
    for (let i = P; i < n; i++) a += `L${x(i).toFixed(1)},${y(all[i].idx).toFixed(1)} `;
    a += `L${x(n-1).toFixed(1)},${(H-pad).toFixed(1)} Z`;
    area = `<path d="${a}" fill="${color}" opacity="0.10"/>`;
  }
  const baseLine = base != null
    ? `<line x1="${pad}" y1="${y(base).toFixed(1)}" x2="${W-pad}" y2="${y(base).toFixed(1)}" stroke="#c7ccd2" stroke-width="1" stroke-dasharray="3 3"/>` : '';
  const divider = P > 0
    ? `<line x1="${x(P-1).toFixed(1)}" y1="${pad}" x2="${x(P-1).toFixed(1)}" y2="${H-pad}" stroke="#b8bec7" stroke-width="1"/>` : '';

  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`
    + area + baseLine + divider
    + (gray ? `<path d="${gray}" fill="none" stroke="#b6bac1" stroke-width="1.4" stroke-linejoin="round"/>` : '')
    + `<path d="${colr}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

function mktCard(m, strong) {
  const dc = m.flu > 0 ? 'up' : (m.flu < 0 ? 'down' : 'flat');
  const sc = strong ? ' strong' : '';
  const inv = [['개인', m.ind], ['외국인', m.frgnr], ['기관', m.orgn]]
    .map(([l, v]) => `<div><div class="l">${l}</div><div class="v ${cls(v)}">${fmtNet(v)}</div></div>`).join('');
  const has = m.idx != null;
  // 전일종가: 어제 시계열의 마지막 값(없으면 오늘 지수-전일대비)
  const prevClose = (m.series_prev && m.series_prev.length) ? m.series_prev[m.series_prev.length - 1].idx
                   : (m.idx != null && m.pred != null ? m.idx - m.pred : null);
  return `<div class="mkt-card ${dc}${sc}"><div class="top"><div>`
    + `<div class="nm">${m.name}</div>`
    + (has ? `<div class="px">${fmtIdx(m.idx)}</div><div class="fl">(${fmtFlu(m.flu)})</div>`
           : `<div class="empty">데이터 수집 대기 중…</div>`)
    + `</div>${mktSpark(m.series_prev, m.series, prevClose, m.flu)}</div>`
    + `<hr class="dv"><div class="inv">${inv}</div></div>`;
}

function breadthTable(markets) {
  const num = v => (v == null) ? '-' : v.toLocaleString('ko-KR');
  const risePct = m => {
    const total = (m.upl||0) + (m.rising||0) + (m.flat||0) + (m.fall||0) + (m.lst||0);
    return (total > 0 && m.rising != null) ? Math.round(m.rising / total * 100) : null;
  };
  const head = `<tr><th>구분</th>`
    + `<th>상한<span class="arw up">▲</span></th>`
    + `<th>상승<span class="arw up">▲</span></th>`
    + `<th>보합<span class="arw flat">–</span></th>`
    + `<th>하락<span class="arw dn">▼</span></th>`
    + `<th>하한<span class="arw dn">▼</span></th></tr>`;
  const rows = markets.map(m => {
    const pct = risePct(m);
    const pctHtml = pct == null ? '' : ` <span class="pct">(${pct}%)</span>`;
    return `<tr><td class="mk">${m.name}</td>`
      + `<td class="num up">${num(m.upl)}</td>`
      + `<td class="num up">${num(m.rising)}${pctHtml}</td>`
      + `<td class="num flat">${num(m.flat)}</td>`
      + `<td class="num dn">${num(m.fall)}</td>`
      + `<td class="num dn">${num(m.lst)}</td></tr>`;
  }).join('');
  return `<table class="breadth-tbl"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

async function renderSummaryCards() {

      strongKey = ms[0].flu >= ms[1].flu ? ms[0].key : ms[1].key;   // 더 강한(높은) 상승

    }
    document.getElementById('mkt-cards').innerHTML = ms.map(m => mktCard(m, m.key === strongKey)).join('');
    document.getElementById('breadth').innerHTML = breadthTable(ms);
  } catch (e) {}
}

function drawProgramChart(series) {
  const host = document.getElementById('prog-chart');
  if (!series || series.length < 2) { host.innerHTML = '<div class="empty">데이터가 없습니다(장중에 조회하세요).</div>'; return; }
  const W = 760, H = 280, mL = 8, mR = 70, mT = 22, mB = 24;
  const iw = W - mL - mR, ih = H - mT - mB;
  const GREEN = '#16a34a';

  // 메인: 시간별 순매수금액(누적) 라인
  const vals = series.map(s => s.net);
  let vmin = Math.min(0, ...vals), vmax = Math.max(0, ...vals);
  if (vmin === vmax) vmax = vmin + 1;
  const pad = (vmax - vmin) * 0.08; vmin -= pad; vmax += pad;
  const n = series.length;
  const x = i => mL + iw * i / (n - 1);
  const y = v => mT + ih * (1 - (v - vmin) / (vmax - vmin));

  const ticks = 5; let grid = '';
  for (let k = 0; k <= ticks; k++) {
    const v = vmin + (vmax - vmin) * k / ticks, yy = y(v);
    grid += `<line x1="${mL}" y1="${yy}" x2="${mL+iw}" y2="${yy}" stroke="#eceef1"/>`;
    grid += `<text x="${mL+iw+6}" y="${yy+4}" font-size="11" fill="#9aa0a8">${Math.round(v).toLocaleString()}</text>`;
  }
  if (vmin < 0 && vmax > 0) grid += `<line x1="${mL}" y1="${y(0).toFixed(1)}" x2="${mL+iw}" y2="${y(0).toFixed(1)}" stroke="#c7ccd2"/>`;

  // X축: 10분 간격 세로선 + 라벨(라벨은 겹치지 않게 최소 간격 유지)
  let xlab = '', vlines = '', prevBucket = null, lastLabelX = -999;
  series.forEach((s, i) => {
    const mins = (+s.tm.slice(0,2)) * 60 + (+s.tm.slice(2,4));
    const bucket = Math.floor(mins / 10);
    if (bucket === prevBucket) return;
    prevBucket = bucket;
    const xi = x(i);
    vlines += `<line x1="${xi.toFixed(1)}" y1="${mT}" x2="${xi.toFixed(1)}" y2="${mT+ih}" stroke="#eceef1"/>`;
    if (xi - lastLabelX >= 44) {
      lastLabelX = xi;
      const bm = bucket * 10;
      const lbl = `${String((bm/60|0)).padStart(2,'0')}:${String(bm%60).padStart(2,'0')}`;
      xlab += `<text x="${xi.toFixed(1)}" y="${H-7}" font-size="10" fill="#9aa0a8" text-anchor="middle">${lbl}</text>`;
    }
  });

  let line = '';
  series.forEach((s, i) => line += `${i === 0 ? 'M' : 'L'}${x(i).toFixed(1)},${y(s.net).toFixed(1)} `);

  // 오버레이: 순매수금액증감 — 상단 밴드의 0선을 기준으로 얇은 막대(빨강+/파랑-)
  const chgs = series.map(s => s.chg || 0);
  const cmax = Math.max(1, ...chgs.map(Math.abs));
  const bandH = ih * 0.16, bandY0 = mT + bandH;      // 상단 밴드 0선
  // 증감 막대: 점마다 <line> 대신 상승/하락 각각 하나의 <path>로 합쳐 요소 수를 최소화(성능)
  let upSp = '', dnSp = '';
  series.forEach((s, i) => {
    const c = s.chg || 0; if (!c) return;
    const h = (Math.abs(c) / cmax) * bandH;
    const seg = `M${x(i).toFixed(1)},${bandY0.toFixed(1)}L${x(i).toFixed(1)},${(c > 0 ? bandY0 - h : bandY0 + h).toFixed(1)}`;
    if (c > 0) upSp += seg; else dnSp += seg;
  });
  const spikes =
    (dnSp ? `<path d="${dnSp}" stroke="var(--neg)" stroke-width="0.7" opacity="0.7"/>` : '')
    + (upSp ? `<path d="${upSp}" stroke="var(--pos)" stroke-width="0.7" opacity="0.7"/>` : '');

  const netLbl = progAmt === '2' ? '순매수수량' : '순매수금액';
  const chgLbl = progAmt === '2' ? '순매수수량증감' : '순매수금액증감';
  const legend = `<g font-size="11">`
    + `<rect x="${mL}" y="6" width="10" height="3" fill="${GREEN}"/><text x="${mL+14}" y="9.5" fill="#6b7280">시간별 ${netLbl}</text>`
    + `<rect x="${mL+130}" y="6" width="10" height="3" fill="var(--neg)"/><text x="${mL+144}" y="9.5" fill="#6b7280">${chgLbl}</text></g>`;

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto">`
    + grid + vlines + spikes
    + `<path d="${line}" fill="none" stroke="${GREEN}" stroke-width="1.6"/>`
    + xlab + legend + '</svg>';
}

  if (!tbody) {
    const netLbl = progAmt === '2' ? '순매수수량' : '순매수금액';
    const chgLbl = progAmt === '2' ? '순매수수량증감' : '순매수증감';
    host.innerHTML = '<div class="prog-tscroll"><table class="prog-tbl"><thead><tr>'
      + `<th>시간</th><th>현재가</th><th>등락률</th><th>${netLbl}</th><th>${chgLbl}</th></tr></thead><tbody></tbody></table></div>`;
    tbody = host.querySelector('.prog-tbl tbody');
    host.querySelector('.prog-tscroll').addEventListener('scroll', onProgScroll);  // 바닥 도달 시 자동 연속조회
    progDomMin = progDomMax = null;
  }
  const scroll = host.querySelector('.prog-tscroll');
  if (progDomMax === null) {                         // 최초: 전체(최신이 위)
    tbody.innerHTML = [...series].reverse().map(progRowHtml).join('');
    progDomMin = series[0].tm; progDomMax = series[series.length - 1].tm;
    return;
  }
  const newer = series.filter(p => p.tm > progDomMax);   // 더 최신 → 위로 prepend
  if (newer.length) {
    tbody.insertAdjacentHTML('afterbegin', [...newer].reverse().map(progRowHtml).join(''));
    progDomMax = newer[newer.length - 1].tm;
  }
  const older = series.filter(p => p.tm < progDomMin);   // 더 과거 → 아래로 append
  if (older.length) {
    const prevTop = scroll.scrollTop;
    tbody.insertAdjacentHTML('beforeend', [...older].reverse().map(progRowHtml).join(''));
    scroll.scrollTop = prevTop + 200;                   // 연속조회 시 새로 불러온 아래쪽으로 조금 이동
    progDomMin = older[0].tm;
  }
}

function progRedraw() {
  const sorted = Object.values(progSeries).sort((a, b) => a.tm < b.tm ? -1 : 1);
  drawProgramChart(sorted);
  drawProgramTable(sorted);
  const moreBtn = document.getElementById('prog-more');
  const canMore = progCont === 'Y' && !!progNext;
  moreBtn.disabled = !canMore;
  document.getElementById('prog-count').textContent =
    `${Object.keys(progSeries).length}건 · 단위: ${progUnit()}`;
}

function progMerge(series) {
  (series || []).forEach(p => { progSeries[p.tm] = p; });
}

// 최신 페이지 갱신(매분/조회): 누적은 유지, 커서는 최초 1회만 설정
async function renderProgram() {
  try {
    const res = await fetch('/api/program?stk=' + encodeURIComponent(progStk) + '&amt=' + progAmt, { cache: 'no-store' });
    if (!res.ok) return;
    const d = await res.json();
    document.getElementById('prog-name').textContent = d.name ? `${d.name} (${d.stk_cd})` : d.stk_cd;
    progMerge(d.series);
    if (!progInited) { progCont = d.cont || 'N'; progNext = d.next || ''; progInited = true; }
    progRedraw();
  } catch (e) {}
}

// 연속조회 버튼: 다음(과거) 페이지를 이어받아 누적
async function loadMoreProgram() {
  if (progLoading || progCont !== 'Y' || !progNext) return;
  progLoading = true;
  const btn = document.getElementById('prog-more');
  btn.disabled = true; btn.textContent = '불러오는 중…';
  try {
    const url = '/api/program?stk=' + encodeURIComponent(progStk)
      + '&amt=' + progAmt + '&cont=Y&next=' + encodeURIComponent(progNext);
    const res = await fetch(url, { cache: 'no-store' });
    if (res.ok) {
      const d = await res.json();
      progMerge(d.series);
      progCont = d.cont || 'N'; progNext = d.next || '';
    }
  } catch (e) {}
  btn.textContent = '연속조회';
  progLoading = false;
  progRedraw();
}

// 표 바닥 근처에 닿으면 자동으로 연속조회
function onProgScroll(e) {
  const el = e.currentTarget;
  if (progCont === 'Y' && progNext && !progLoading
      && el.scrollTop + el.clientHeight >= el.scrollHeight - 80) {
    loadMoreProgram();
  }
}

function progReset() {
  progSeries = {}; progNext = ''; progCont = 'N'; progInited = false;
  progDomMin = null; progDomMax = null;
  const t = document.getElementById('prog-table'); if (t) t.innerHTML = '';   // 표 초기화(전체 재구성 유도)
}

// 종목코드를 검색창에 넣고 프로그램 순매수금액을 조회
function loadProgStock(code) {
  const v = (code || '').replace(/\D/g, '').slice(0, 6);
  if (!v) return;
  progStk = v;
  const inp = document.getElementById('prog-stk');
  if (inp) inp.value = v;
  try { localStorage.setItem('netprps_prog_stk', v); } catch (e) {}
  progReset();
  renderProgram();
}

(function () {
  const inp = document.getElementById('prog-stk');
  inp.value = progStk;
  document.getElementById('prog-go').addEventListener('click', () => loadProgStock(inp.value));
  document.getElementById('prog-more').addEventListener('click', loadMoreProgram);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') loadProgStock(inp.value); });

  // 금액/수량 선택 (KOSPI/KOSDAQ와 동일한 라디오 방식)
  const amtLabels = document.querySelectorAll('#prog-amt label');
  const syncAmt = () => amtLabels.forEach(l => {
    const inp = l.querySelector('input');
    inp.checked = inp.value === progAmt;
    l.classList.toggle('on', inp.checked);
  });
  syncAmt();
  document.querySelectorAll('#prog-amt input[name="progamt"]').forEach(r => {
    r.addEventListener('change', () => {
      if (!r.checked || r.value === progAmt) return;
      progAmt = r.value;
      try { localStorage.setItem('netprps_prog_amt', progAmt); } catch (e) {}
      syncAmt();
      progReset();
      renderProgram();
    });
  });
})();

async function refresh() {
  renderSummaryCards();   // 상단 카드도 함께 갱신
  renderRank();           // 조회수 상위 종목 갱신
  renderProgram();        // 하단 프로그램 순매수금액 차트도 갱신
  try {
    const res = await fetch('/api/netprps?mrkt=' + encodeURIComponent(curMarket), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
    if (DATA.market) curMarket = DATA.market;           // 서버가 보정한 값 반영
    if (selected === null) selected = loadSelected();  // 최초 1회 초기화

    // 최신 시각이 바뀌었으면(새 분 데이터) 증감 행 번쩍임 (최초 로드는 제외)
    const latestT = DATA.points.length ? DATA.points[DATA.points.length - 1].t : null;
    const isNew = latestT && lastLatestT !== undefined && latestT !== lastLatestT;
    lastLatestT = latestT;

    renderMarkets();
    renderControls();
    renderTable();
    renderChart();
    if (isNew) flashDelta();
  } catch (e) {}
}

// 서버는 매 분 :00에 조회·기록한다. 브라우저 갱신을 :00 직후로 맞춰 지연을 최소화.
const REFRESH_OFFSET_MS = 3000;   // :00 이후 서버가 기록을 마칠 여유(초)
function scheduleRefresh() {
  const now = Date.now();
  const nextTick = Math.floor(now / 60000) * 60000 + 60000 + REFRESH_OFFSET_MS;  // 다음 :00 + 여유
  setTimeout(() => { refresh(); scheduleRefresh(); }, nextTick - now);
}

// 투자자 선택란 접기/펼치기 (상태 유지)
(function () {
  const KEY = 'netprps_controls_collapsed';
  const ctl = document.getElementById('controls');
  const btn = document.getElementById('toggle-controls');
  let collapsed = false;
  try { collapsed = localStorage.getItem(KEY) === '1'; } catch (e) {}
  const apply = () => {
    ctl.classList.toggle('collapsed', collapsed);
    btn.textContent = '투자자 선택 ' + (collapsed ? '▸' : '▾');
  };
  apply();
  btn.addEventListener('click', () => {
    collapsed = !collapsed;
    try { localStorage.setItem(KEY, collapsed ? '1' : '0'); } catch (e) {}
    apply();
  });
})();

refresh();          // 최초 즉시 1회
scheduleRefresh();  // 이후 매 분 :00+3초에 갱신
</script>
</body>
</html>
